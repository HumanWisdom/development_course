
name: Website-Production
on:
  push:
    branches: [Production]
    
jobs:
  build-website:
     runs-on: ubuntu-latest
    
     steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd HumanWisdom/projects/getStarted
          npm install

      - name: Ensure CSS directory exists
        run: mkdir -p HumanWisdom/projects/getStarted/assets-min/css

      - name: Run Gulp to minify CSS
        run: |
          cd HumanWisdom/projects/getStarted
          npx gulp

      - name: Compress the build artifacts
        run: |
          cd HumanWisdom
          mkdir -p builds/compressed
          tar -czf builds/compressed/website.tgz projects/getStarted
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
             name: website-artifact
             path: HumanWisdom/builds/compressed/website.tgz
  
  website-deploy:
    runs-on: prod-hosted
    needs: build-website

    steps:
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
               name: website-artifact
               path: builds/compressed/${{ github.run_id }}

        - name: Deploy website
          run: |
           mkdir -p builds/uncompressed/${{ github.run_id }}
           tar -zxf builds/compressed/${{ github.run_id }}/website.tgz -C builds/uncompressed/${{ github.run_id }}
           sudo rm -rf /var/www/html/getStarted/
           sudo mv builds/uncompressed/${{ github.run_id }}/projects/getStarted /var/www/html/
           sudo chown -R ubuntu:ubuntu /var/www/html/getStarted
