name: build-HumanWisdom-staging
on:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  find-pr-build:
    name: Find PR Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find-run.outputs.run_id }}
    steps:
      - name: Find successful PR check run for this merge
        id: find-run
        run: |
          PR_HEAD_SHA=$(gh pr list \
            --state merged \
            --base dev \
            --limit 1 \
            --json headRefOid \
            --jq '.[0].headRefOid')

          echo "Merged PR head SHA: $PR_HEAD_SHA"

          RUN_ID=$(gh run list \
            --workflow=pr-check.yml \
            --commit=$PR_HEAD_SHA \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId' \
            --repo ${{ github.repository }})

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "No PR build found for SHA $PR_HEAD_SHA"
            exit 1
          fi

          echo "Reusing artifacts from PR build run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  adults-deploy:
    name: Deploy Adults
    runs-on: self-hosted
    needs: find-pr-build
    steps:
      - name: Download Adults artifact from PR build
        run: |
          gh run download ${{ needs.find-pr-build.outputs.run_id }} \
            --name adults-artifact \
            --dir ./downloaded-artifacts/adults \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup the build on remote server
        run: |
          mkdir -p builds/uncompressed/${{ github.run_id }}
          tar -zxf downloaded-artifacts/adults/program.tgz -C builds/uncompressed/${{ github.run_id }}
          sudo rm -rf /var/www/html/adults
          sudo mv builds/uncompressed/${{ github.run_id }}/www /var/www/html/adults
          sudo chown ubuntu:ubuntu /var/www/html/adults
          rm -rf downloaded-artifacts

  deploy-teenagers:
    name: Deploy Teenagers
    runs-on: self-hosted
    needs: find-pr-build
    steps:
      - name: Download Teenagers artifact from PR build
        run: |
          gh run download ${{ needs.find-pr-build.outputs.run_id }} \
            --name teenagers-artifact \
            --dir ./downloaded-artifacts/teenagers \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup the build on remote server
        run: |
          mkdir -p builds/uncompressed/${{ github.run_id }}
          tar -zxf downloaded-artifacts/teenagers/program.tgz -C builds/uncompressed/${{ github.run_id }}
          sudo rm -rf /var/www/html/teenagers
          sudo mv builds/uncompressed/${{ github.run_id }}/teenagers /var/www/html/teenagers
          sudo chown ubuntu:ubuntu /var/www/html/teenagers
          rm -rf downloaded-artifacts
