name: build-HumanWisdom-staging
on:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  find-pr-build:
    name: Find PR Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find-run.outputs.run_id }}
      found: ${{ steps.find-run.outputs.found }}
    steps:
      - name: Find successful PR check run for this merge
        id: find-run
        run: |
          PR_HEAD_SHA=$(gh pr list \
            --state merged \
            --base dev \
            --limit 1 \
            --json headRefOid \
            --jq '.[0].headRefOid' \
            --repo ${{ github.repository }})

          echo "Merged PR head SHA: $PR_HEAD_SHA"

          RUN_ID=$(gh run list \
            --workflow=pr-check.yml \
            --commit=$PR_HEAD_SHA \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId' \
            --repo ${{ github.repository }})

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "No PR build found — will build from scratch"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Reusing artifacts from PR build run: $RUN_ID"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Fallback: runs only when no PR artifacts exist ──────────────────────────

  build-adults-fallback:
    name: Build Adults (fallback)
    runs-on: ubuntu-latest
    needs: find-pr-build
    if: needs.find-pr-build.outputs.found == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24.0.0'

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: HumanWisdom/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install global dependencies
        run: |
          npm install -g @ionic/cli
          npm install -g @angular/cli

      - name: Install project dependencies
        run: |
          cd HumanWisdom
          npm install --force

      - name: Build Adults
        run: |
          cd HumanWisdom
          export NODE_OPTIONS=--max_old_space_size=8096
          ng build --configuration=staging --project="adults" --base-href /adults/

      - name: Compress Adults artifact
        run: |
          cd HumanWisdom
          mkdir -p builds/compressed
          tar -czf builds/compressed/program.tgz www/

      - name: Upload Adults artifact
        uses: actions/upload-artifact@v4
        with:
          name: adults-artifact
          path: HumanWisdom/builds/compressed/program.tgz

  build-teenagers-fallback:
    name: Build Teenagers (fallback)
    runs-on: ubuntu-latest
    needs: find-pr-build
    if: needs.find-pr-build.outputs.found == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24.0.0'

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: HumanWisdom/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install global dependencies
        run: |
          npm install -g @ionic/cli
          npm install -g @angular/cli

      - name: Install project dependencies
        run: |
          cd HumanWisdom
          npm install --force

      - name: Build Teenagers
        run: |
          cd HumanWisdom
          export NODE_OPTIONS=--max_old_space_size=8096
          ng build --configuration=staging --project="teenagers" --base-href /teenagers/

      - name: Compress Teenagers artifact
        run: |
          cd HumanWisdom
          mkdir -p builds/compressed
          tar -czf builds/compressed/program.tgz teenagers/

      - name: Upload Teenagers artifact
        uses: actions/upload-artifact@v4
        with:
          name: teenagers-artifact
          path: HumanWisdom/builds/compressed/program.tgz

  # ── Deploy: always runs regardless of which build path was taken ─────────────

  adults-deploy:
    name: Deploy Adults
    runs-on: self-hosted
    needs: [find-pr-build, build-adults-fallback]
    if: always() && needs.find-pr-build.result == 'success'
    steps:
      - name: Download Adults artifact from PR build
        if: needs.find-pr-build.outputs.found == 'true'
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.find-pr-build.outputs.run_id }}
          name: adults-artifact
          path: ./downloaded-artifacts/adults

      - name: Download Adults artifact from fallback build
        if: needs.find-pr-build.outputs.found == 'false'
        uses: actions/download-artifact@v4
        with:
          name: adults-artifact
          path: ./downloaded-artifacts/adults

      - name: Setup the build on remote server
        run: |
          mkdir -p builds/uncompressed/${{ github.run_id }}
          tar -zxf downloaded-artifacts/adults/program.tgz -C builds/uncompressed/${{ github.run_id }}
          sudo rm -rf /var/www/html/adults
          sudo mv builds/uncompressed/${{ github.run_id }}/www /var/www/html/adults
          sudo chown ubuntu:ubuntu /var/www/html/adults
          rm -rf downloaded-artifacts

  deploy-teenagers:
    name: Deploy Teenagers
    runs-on: self-hosted
    needs: [find-pr-build, build-teenagers-fallback]
    if: always() && needs.find-pr-build.result == 'success'
    steps:
      - name: Download Teenagers artifact from PR build
        if: needs.find-pr-build.outputs.found == 'true'
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.find-pr-build.outputs.run_id }}
          name: teenagers-artifact
          path: ./downloaded-artifacts/teenagers

      - name: Download Teenagers artifact from fallback build
        if: needs.find-pr-build.outputs.found == 'false'
        uses: actions/download-artifact@v4
        with:
          name: teenagers-artifact
          path: ./downloaded-artifacts/teenagers

      - name: Setup the build on remote server
        run: |
          mkdir -p builds/uncompressed/${{ github.run_id }}
          tar -zxf downloaded-artifacts/teenagers/program.tgz -C builds/uncompressed/${{ github.run_id }}
          sudo rm -rf /var/www/html/teenagers
          sudo mv builds/uncompressed/${{ github.run_id }}/teenagers /var/www/html/teenagers
          sudo chown ubuntu:ubuntu /var/www/html/teenagers
          rm -rf downloaded-artifacts
