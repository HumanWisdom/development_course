name: Deploy-Website

on:
  push:
    branches: [dev]

jobs:
  build-website:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (required for clean-css-cli)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Install clean-css-cli
      - name: Install clean-css
        run: npm install -g clean-css-cli

      # Step 4: Minify all CSS files in projects/getStarted
      - name: Minify CSS files
        run: |
          cd HumanWisdom/projects/getStarted/assets
          # Assuming CSS files are in a 'css' subfolder; adjust the path as needed
          if [ -d "css" ]; then
            for file in css/*.css; do
              if [ -f "$file" ]; then
                cleancss -o "$file" "$file"
              fi
            done
          else
            echo "No 'css' directory found in projects/getStarted"
          fi

      # Step 5: Compress the build artifacts
      - name: Compress the build artifacts
        run: |
          cd HumanWisdom
          mkdir -p builds/compressed
          tar -czf builds/compressed/website.tgz projects/getStarted

      # Step 6: Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: website-artifact
          path: HumanWisdom/builds/compressed/website.tgz

  website-deploy:
    runs-on: ubuntu-latest
    needs: build-website

    steps:
      # Step 1: Download the artifact
      - name: Download artifact
        uses: actions/download-artifact@v4.1.5
        with:
          name: website-artifact

      # Step 2: Copy the artifact to remote server
      - name: Copy the artifact to remote server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.NEWSERVERKEY }}
          source: "website.tgz"
          target: "builds/compressed/${{ github.run_id }}"

      # Step 3: Setup the build on remote server
      - name: Setup the build on remote server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.NEWSERVERKEY }}
          script: |
            rm -rf builds/uncompressed/${{ github.run_id }}
            mkdir -p builds/uncompressed/${{ github.run_id }}
            tar -zxf builds/compressed/${{ github.run_id }}/website.tgz -C builds/uncompressed/${{ github.run_id }}
            sudo rm -rf /var/www/html/getStarted/
            sudo mv builds/uncompressed/${{ github.run_id }}/projects/getStarted /var/www/html/
            sudo chown ubuntu:ubuntu /var/www/html/getStarted
