name: Deploy-Website

on:
  push:
    branches: [dev]

jobs:
  build-website:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (required for Gulp and Gulp plugins)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Install dependencies (Gulp and Gulp plugins)
      - name: Install dependencies
        run: |
          npm install --save-dev gulp gulp-clean-css

      # Step 4: Create gulpfile.js to define the task
      - name: Create gulpfile.js
        run: |
          echo "
          const gulp = require('gulp');
          const cleanCSS = require('gulp-clean-css');

          // Define the CSS minify task for each folder
          function minifyCSS() {
              // Process and output files from 'assets-min/css/'
              return gulp.src('assets-min/css/*.css')
                  .pipe(cleanCSS({ compatibility: 'ie8' }))  // Minify CSS
                  .pipe(gulp.dest('assets-min/css/'));  // Output to 'assets-min/css/'

              // Process and output files from 'assets-min/font/'
              return gulp.src('assets-min/font/*.css')
                  .pipe(cleanCSS({ compatibility: 'ie8' }))  // Minify CSS
                  .pipe(gulp.dest('assets-min/font/'));  // Output to 'assets-min/font/'
          }

          // Use gulp.series to ensure task completion
          gulp.task('minify-css', minifyCSS);

          // Default task (run when you execute `gulp` without any task name)
          gulp.task('default', gulp.series('minify-css'));
          " > gulpfile.js

      # Step 5: Run the Gulp task to minify CSS files
      - name: Minify CSS files using Gulp
        run: |
          npx gulp

      # Step 6: Compress the build artifacts
      - name: Compress the build artifacts
        run: |
          cd HumanWisdom
          mkdir -p builds/compressed
          tar -czf builds/compressed/website.tgz projects/getStarted

      # Step 7: Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: website-artifact
          path: HumanWisdom/builds/compressed/website.tgz

  website-deploy:
    runs-on: ubuntu-latest
    needs: build-website

    steps:
      # Step 1: Download the artifact
      - name: Download artifact
        uses: actions/download-artifact@v4.1.5
        with:
          name: website-artifact

      # Step 2: Copy the artifact to remote server
      - name: Copy the artifact to remote server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.NEWSERVERKEY }}
          source: "website.tgz"
          target: "builds/compressed/${{ github.run_id }}"

      # Step 3: Setup the build on remote server
      - name: Setup the build on remote server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.NEWSERVERKEY }}
          script: |
            rm -rf builds/uncompressed/${{ github.run_id }}
            mkdir -p builds/uncompressed/${{ github.run_id }}
            tar -zxf builds/compressed/${{ github.run_id }}/website.tgz -C builds/uncompressed/${{ github.run_id }}
            sudo rm -rf /var/www/html/getStarted/
            sudo mv builds/uncompressed/${{ github.run_id }}/projects/getStarted /var/www/html/
            sudo chown ubuntu:ubuntu /var/www/html/getStarted
