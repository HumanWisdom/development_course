# ========================================
# Docker Example for Testing
# ========================================
# File: Dockerfile.test

FROM node:18-alpine

# Install Chromium
RUN apk add --no-cache \
    chromium \
    nss \
    freetype \
    freetype-dev \
    harfbuzz \
    ca-certificates \
    ttf-freefont

# Set Chrome path
ENV CHROME_BIN=/usr/bin/chromium-browser
ENV CHROME_PATH=/usr/lib/chromium/

WORKDIR /app

# Copy package files
COPY HumanWisdom/projects/adults/package*.json ./

# Install dependencies
RUN npm ci

# Copy source code
COPY HumanWisdom/projects/adults ./

# Run tests
CMD ["npm", "run", "test:ci"]

# ========================================
# Docker Compose Example
# ========================================
# File: docker-compose.test.yml

version: '3.8'

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./HumanWisdom/projects/adults:/app
      - /app/node_modules
    environment:
      - CI=true
      - CHROME_BIN=/usr/bin/chromium-browser
    command: npm run test:ci

  test-shared:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./HumanWisdom/projects/adults:/app
      - /app/node_modules
    environment:
      - CI=true
      - CHROME_BIN=/usr/bin/chromium-browser
    command: npm run test:ci:shared

# Run with: docker-compose -f docker-compose.test.yml up

---

# Usage Instructions:

# 1. Choose the CI/CD platform you're using
# 2. Copy the relevant configuration to your project root
# 3. Adjust paths and settings as needed
# 4. Commit and push to trigger the pipeline

# Notes:
# - All examples use headless Chrome for testing
# - Coverage reports are generated and archived
