<!-- header -->
<!-- <app-tn-dashboard-v03 [enableplaystore]="false"></app-tn-dashboard-v03> -->
<!-- /header -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_02 overflow_hidden" #notificationTop>
  <!-- Class -->  
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 p0 sc_01  bg_white col_cw">
        <div class="x_panel p0">            
          <div class="x_content p0">

            <form>             
              <div class="row plr10px">
                <div class="col-md-12 col-sm-12 col-xs-12">
                  <h6 class="fw_400 fs_18px lh_21px fc_000000 tleft">
                    Notifications
                  </h6>
                </div>
              </div>    

              <!-- Latest Notifications -->
              <ng-container *ngFor="let item of notificationModel">
                <div class="{{ getClass(item) }}">
                  <a class="center_flex" (click)="NavigateToUrl(item.Url, item.NotificationId)">
                    <div class="col-md-2 col-sm-2 col-xs-2 tcenter">
                      <img src="{{ item.IconPath }}" alt="" class="img-responsive">
                    </div>

                    <div class="col-md-10 col-sm-10 col-xs-10 pl15px">
                       <h6 class="tleft mtb0px">                    
                        <span [innerHtml]="item.NotificationMsg" class="fw_600 fs_15px lh_130p fc_000000"></span>
                      </h6>
                      <h6 class="tleft mtb0px">                    
                        <span [innerHtml]="item.NotificationMsg" class="fw_400 fs_12px lh_130p fc_000000"></span>
                      </h6>
                      <h6 class="tleft mtb10px">
                        <span class="fw_400 fs_12px lh_130p fc_000000_0_5">{{ item.Time }}</span>                    
                      </h6>
                    </div>

                    <!-- <div class="col-md-2 col-sm-2 col-xs-2">
                      <h6 class="tright mtb0px">
                        <span class="fw_400 fs_12px lh_130p fc_adadad flex_end">{{ item.Time }}</span>                    
                      </h6>
                    </div> -->
                  </a>
                </div>
              </ng-container>
              <!-- /Latest Notifications -->

              <!-- Older Notifications (conditionally shown) -->
              <ng-container *ngIf="showOlderNotifications">
                <ng-container *ngFor="let item of olderNotitification">
                  <div class="{{ getClass(item) }}">
                    <a class="center_flex" (click)="NavigateToUrl(item.Url, item.NotificationId)">
                      <div class="col-md-2 col-sm-2 col-xs-2 tcenter">
                        <img [src]="item.IconPath" alt="" class="img-responsive">
                      </div>

                      <div class="col-md-8 col-sm-8 col-xs-8 pl15px">
                        <h6 class="tleft mtb0px">
                          <span [innerHtml]="item.NotificationMsg" class="fw_400 fs_12px lh_130p fc_5d5d5d"></span>
                        </h6>
                      </div>

                      <div class="col-md-2 col-sm-2 col-xs-2">
                        <h6 class="tright mtb0px">
                          <span class="fw_500 fs_10px lh_130p fc_adadad flex_end">{{ item.Time }}</span>
                        </h6>
                      </div>
                    </a>
                  </div>
                </ng-container>
              </ng-container>
              <!-- /Older Notifications -->

              <!-- Toggle Button (Always at Bottom) -->
                <div class="row center_flex pt40px" style="cursor: pointer;" (click)="toggleNotifications()">
                  <div class="col-md-12 col-sm-12 col-xs-12">
                    <h6 class="mtb0px tcenter">
                      <span class="fw_400 fs_12px lh_14px fc_5d5d5d">{{ toggleText }}</span>
                    </h6>
                    <br>
                  </div>
                </div>
              <!-- /Toggle Button -->

              <div class="pagebreak"></div>
            </form> 

          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/Class --> 
</div>
<!-- /page content -->
