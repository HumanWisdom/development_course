    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 ">
        <a (click)="rouetToPath(section)">
            <div class="col-lg-4  col-md-4 col-sm-4 col-xs-4 p0 tcenter ">
                <img [src]="section.image_path"  class="p0 session_imgnew" >
            </div>
            <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8  p0 " [ngStyle]="getStyles()">
                <div class="row" [ngClass]="getForumClass() ">
                    <div id="photo">
                        <img style="vertical-align:middle" [src]="'https://d1tenzemoxuh75.cloudfront.net' + section.icon_path"  alt="" >
                        <span style="vertical-align:middle"
                            class="mt0px  fw_400 fs_12px lh_130p fc_e58d82 plr5px">{{section.module}}</span>
                    </div>

                </div>
                <h4 class="mt0px mb5px fs_15px fw_500 lh_130p  fc_ffffff"  >
                    {{section.title}}
                </h4>
                <h4 class="mt0px mb5px fs_12px fw_400 lh_130p fc_ffffff_0_5 ellipsis" *ngIf="section.subtitle && section.subtitle!=''" >
                    {{section.subtitle}}
                </h4>
                <h4 class="mt0px mb5px fs_12px fw_400 lh_130p fc_ffffff_0_5 " >
                    {{section.timing}}
                </h4>
            </div>
        </a>
    </div>
