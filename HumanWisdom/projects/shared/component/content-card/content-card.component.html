<div class="content-card rounded-4 overflow-hidden position-relative" (click)="onCardClick()" style="width: 200px; height: 250px;">
  <div class="card-image position-relative" style="height: auto;">
    <img [src]="card.imageUrl" [alt]="card.title" class="custom-box-img object-fit-cover">

    <!-- Overlay -->
    <div class="card-overlay d-flex justify-content-center align-items-center position-absolute top-0 start-0 w-100 h-100">
      <!-- Show image if overlayIcon is a URL, otherwise show FontAwesome icon -->
      <img *ngIf="getOverlayIconSrc(card.overlayIcon)" 
           [src]="getOverlayIconSrc(card.overlayIcon)" 
           [alt]="'Overlay icon'" 
           class="overlay-icon fs-2  rounded-circle p-3"
           style="width: 48px; height: 48px; object-fit: contain;">
      <i *ngIf="!getOverlayIconSrc(card.overlayIcon)" 
         [class]="getOverlayIconClass(card.overlayIcon)" 
         class="overlay-icon fs-2 text-white bg-opacity-50 p-3"></i>
    </div>
  </div>

  <div class="card-content p-3 custom-box-text-container">
    <h6 class="card-title mb-2 text-truncate custom-box-text-container-title no-break">{{ card.title }}</h6>
    <p class="card-subtitle small text-muted mb-2" *ngIf="card.subtitle">{{ card.subtitle }}</p>
    <div class="card-meta d-flex align-items-center gap-2 small text-muted">
      <span class="media-type fw-bold text-uppercase custom-box-text-container-mediaType">{{ card.mediaType }}</span>
      <span class="duration custom-box-text-container-mediaType" *ngIf="card.duration">• {{ card.duration }}</span>
    </div>
  </div>
</div>
