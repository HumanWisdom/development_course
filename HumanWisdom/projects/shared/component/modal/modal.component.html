<span #enablecookiemodal data-toggle="modal" data-target="#modal-alert"></span>

<!-- v1.1 -->
<div class="modal fade inp" id="modal-alert" data-keyboard="false" data-backdrop="false" data-dismiss="modal">


  <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 lab-modal-body col_cw"  [ngClass]="isAdults ? 'v1_3_bg_splashnewpremium' : 'v1_3_bg_splash_teens'" *ngIf="isFreeTrialEnable">
      <form>
        <div class="row mt20px">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
            <img src="https://d1tenzemoxuh75.cloudfront.net/website/svgs/overcome.svg" style="width:136px; height: auto;"
              class="img-responsive">
          </div>
        </div>

        <div class="row mt20px">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
            <h4 class="mtb0px fs_24px fw_500 lh_130p fc_ffffff tcenter">
              The best is yet to come 
            </h4>
          </div>
        </div>

        <div class="row mt10px">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
            <h4 class="mtb0px fs_15px fw_400 lh_150p fc_ffffff_0_7 tcenter">
              Unlock the full experience and continue
            </h4>
            <h4 class="mtb0px fs_15px fw_400 lh_150p fc_ffffff_0_7 tcenter">
              your journey to live your best life
            </h4>
          </div>
        </div>

        <div class="row mt30px mb20px" (click)="routeTofreetrial()">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
            <button type="btn" class="btn btn_ctd">
             Start your free trial
            </button>
          </div>
        </div>
        <!-- <div class="pagebreak"></div>  -->
      </form>
    </div>
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 lab-modal-body col_cw" [ngClass]="isAdults ? 'v1_3_bg_splashnewpremium' : 'v1_3_bg_splash_teens'" *ngIf="!isFreeTrialEnable">
      <div class="row mb10px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
          <h4 class="mtb0px fs_18px fw_600 lh_150p fc_ffffff">
            {{title}}
          </h4>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
          <h4 class="mtb0px fs_15px fw_400 lh_150p fc_ffffff_0_5">
            {{content}}
          </h4>
        </div>
      </div>

      <div class="row mt30px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 btn_popups">
          <button type="btn" class="btn btn_ctd" data-dismiss="modal" *ngIf="modalid === ''" (click)="close('ok')">
            {{okText}}
          </button>

          <button type="btn" class="btn btn_ctd" data-dismiss="modal" id="liLogout" *ngIf="modalid === 'logout'"
            (click)="close('ok')">
            {{okText}}
          </button>

          <button type="btn" class="btn btn_ctd" data-dismiss="modal" *ngIf="enableCancel" (click)="close('cancel')">
            {{cancelText}}
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
<!-- /v1.1 -->
