<!-- Trigger (Can be placed wherever needed) -->
<span id="enablecookiemodal" data-bs-toggle="modal" data-bs-target="#modal-alert"></span>

<!-- Modal Start -->
<div class="modal fade in show  d-block" (click)="close('cancel')"   id="modal-alert" tabindex="-1"  >
  <!-- <div class="modal-backdrop" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1040;opacity:0.5;background:#000;"></div> -->
      <div class="row center_flex" (click)="$event.stopPropagation()">

        <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 lab-modal-body col_cw" [ngClass]="isAdults ? 'v1_3_bg_splashnewpremium' : 'v1_3_bg_splash_teens'" *ngIf="isFreeTrialEnable">
          <form>

            <div class="text-center mb-4">
              <img src="https://d1tenzemoxuh75.cloudfront.net/website/svgs/overcome.svg" class="img-fluid" style="width: 136px;" alt="Overcome Illustration">
            </div>

            <h4 class="fs_24px fw_500 fw_500 lh_130p  text-center" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">The best is yet to come</h4>
            <h4 class="fs_15px fw_400 lh_150p  text-center mt-3 mb-1"  [ngClass]="isAdults ? 'fc_000000_0_7' : 'fc_ffffff_0_7'">Unlock the full experience and continue</h4>
            <h4 class="fs_15px fw_400 lh_150p  text-center mb-4" [ngClass]="isAdults ? 'fc_000000_0_7' : 'fc_ffffff_0_7'">your journey to live your best life</h4>

            <div class="d-grid mb-5">
              <button type="button" class="btn btn_ctd" (click)="routeTofreetrial()">Start your free trial</button>
            </div>

          </form>
        </div>

        <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 lab-modal-body col_cw"
             [ngClass]="isAdults ? 'v1_3_bg_splashnewpremium' : 'v1_3_bg_splash_teens'" *ngIf="!isFreeTrialEnable">

             <div class="row" *ngIf="modalid === 'logout'">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12  p0 center_flex">
          <a class="">
            <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/modal_logout.svg" alt="" class="p0">
          </a>
        </div>
      </div>

     <div class="row mtb30px"  *ngIf="(title!='')">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
          <h4 class="mtb0px fs_18px fw_600 lh_150p p0" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
            {{title}}
          </h4>
        </div>
      </div>

      <div class="row mtb30px"  *ngIf="(content !='')">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
          <h4 class="mtb0px fs_15px fw_400 lh_150p p0" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff_0_5'">
            {{content}}
          </h4>
        </div>
      </div>

             <div class="row ">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 btn_popups">
          <div class="d-grid gap-0 ">
            <button type="button" class="btn btn-primary modal-btn fs_18px fw_600"  [ngClass]="isAdults? 'modal-btn-adults':'modal-btn-teens'" *ngIf="modalid === ''" data-bs-dismiss="modal" (click)="close('ok')">
              {{okText}}
            </button>

            <button type="button" class="btn btn-primary modal-btn fs_18px fw_600" [ngClass]="isAdults? 'modal-btn-adults':'modal-btn-teens'" id="liLogout" *ngIf="modalid === 'logout'" data-bs-dismiss="modal" (click)="close('ok')">
              {{okText}}
            </button>

            <a class="text-center fs_15px fw_400 lh_21px mt10px  hcancel" [ngClass]="isAdults ? 'fc_000000_i' : 'fc_e58d82'" *ngIf="enableCancel && modalid === 'logout'" data-bs-dismiss="modal" (click)="close('cancel')">
              {{cancelText}}
            </a>
             <button type="button" class="btn btn-primary modal-btn modal_cancel_btn" [ngClass]="isAdults? 'modal-btn-adults':'modal-btn-teens'" *ngIf="enableCancel && modalid != 'logout'" data-bs-dismiss="modal" (click)="close('cancel')">
              {{cancelText}}
            </button>
           
          </div>
    </div>
      </div>
        </div>

    
  </div>
</div>
<!-- Modal End -->
