<app-bg-video></app-bg-video> -->
<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw" [ngClass]="isAdults ?'bg_FFF7E6':'bg_183c79'">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a (click)="goBack()">
        <!-- adult version -->
        <img *ngIf="isAdults" src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt=""
          class="p0" />

        <!-- teen version -->
        <img *ngIf="!isAdults" src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/arrow_left.svg"
          alt="" class="p0" />
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1 class="fw_600 fs_18px lh_140p mtb0px tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">{{ headerTitle
        }}
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0"></div>
  </div>
</div>
<!-- /top navigation -->

<!-- page content -->
<div class="right_col mc_02">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 bg_stake col_cw">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>

              <!-- <div class="row mt10px mb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 tcenter" (click)="gotoTranscript()">
                  <a class="">
                    <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/transcript_left.svg" class="img-responsive" alt="">
                  </a>
                </div>
              </div> -->

        

              <div class="row" *ngIf="enableTextContent">
                <!-- <p class="txt1 mt40px mb30px"> -->
                    <div class="row tcenter read-text-row" (click)="readText('Back To Audio')"
                (keydown.enter)="readText('Back To Audio')" tabindex="0"
                *ngIf="audioLink !== '' && hasTranscript">
                <!-- <p class="txt1 mt40px mb30px"> -->
                <a class="read-text-link">
                  <h6 class="fs_15px fw_400 lh_140p underline mtb10px read-text-label" [ngClass]="isAdults ? 'fc_D7586B' : 'fc_ee9596'">
                    {{'Back To Audio' }} </h6>
                </a>
                <!-- </p> -->
              </div>
                <h3 class="transcript_txt" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'" [innerHTML]="textContent">
                </h3>
                <!-- </p> -->
              </div>

              <div class="row" *ngIf="enableImage && !enableTextContent">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 tcenter">
                  <img [src]="imageUrl" class="img-responsive img_podcast_02">
                </div>
              </div>

              <h1 class="txt1  mb30px" *ngIf="!enableTextContent">
                {{audioTitle}}
              </h1>

              <div class="row tcenter" *ngIf="!enableTextContent">
                <div class="col-md-12 col-sm-12 col-xs-12 center_flex p0" *ngIf="audioLink !== ''">
                  <!--  <audio autoplay id="aud1" controls controlsList="nodownload" #audio
                   [ngClass]="[isAdults ? 'invert-controls' : '']">
                    <source [src]="audioLink" type="audio/mpeg">
                  </audio> -->
                  <app-audio-player id="aud1" [ngClass]="[isAdults ? 'invert-controls' : '']" [audioLink]="audioLink">
                  </app-audio-player>

                </div>
              </div>
              <div class="row tcenter read-text-row" (click)="readText('Read text')"
                (keydown.enter)="readText( 'Read text')" tabindex="0"
                *ngIf="audioLink !== '' && hasTranscript && !enableTextContent">
                <!-- <p class="txt1 mt40px mb30px"> -->
                <a class="read-text-link">
                  <h6 class="fs_15px fw_400 lh_140p underline mtb10px read-text-label" [ngClass]="isAdults ? 'fc_D7586B' : 'fc_ee9596'">
                    {{'Read text'}} </h6>
                </a>
                <!-- </p> -->
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->
