<title>Best Mental Health Apps|Stress, Anger & Depression Management|HappierMe</title>
<meta name="description"
  content="HappierMe apps can guide you to become the best person you can be, and discover life-changing wisdom through self-understanding. Learn the art of anger and stress management, get solutions for anxiety and depression.">

<app-bg-video></app-bg-video>

<div class="right_col mc_03 ">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01_home col_cw home-content">
        <div class="x_panel p0">
          <div class="x_content p0">

            <div class="row home-container">
              <div class="col-12">
                <div class="d-flex flex-wrap">
                  <div class="nav-menu">
                      <a *ngFor="let item of navigationItems"
                         class="nav-item"
                         [class.nav-item--selected]="item.active"
                         [class.nav-item--unselected]="!item.active"
                         (click)="onNavigationClick(item)">
                        <span *ngIf="item.id!='999'">{{ item.displayName }}</span>
                      </a>
                  </div>
                </div>
              </div>
            </div>

            <div class="row home-container">
              <div class="col-12">
                <div class="p-3">
                  <p class="text-muted mb-0 mt-4">{{ description }}</p>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 p-0">

                <!-- recursive template for a section -->
                <ng-template #renderSection let-section>
                  <div [class]="section.cssClass ? section.cssClass : ''">

                    <!-- If section is an inline panel (non-accordion), render as title + visible cards -->
                    <ng-container *ngIf="section.isInlineSection; else accordionHeader">
                      <div class="p-2">
                        <h6 class="mb-2 section-title-inline">{{ section.title }}</h6>
                        <small class="text-muted" *ngIf="section.subtitle">{{ section.subtitle }}</small>
                      </div>
                      <div class="p-2">
                        <!-- Horizontal vs Vertical card layout based on section.isVerticalCards flag -->
                        <div *ngIf="section.cards && section.cards.length">
                          <!-- HORIZONTAL (default) -->
                          <div class="d-flex card-container" *ngIf="!section.isVerticalCards">
                            <div *ngFor="let card of getDisplayCards(section)" class="me-3" style="min-width: 200px; flex-shrink: 0;">
                              <app-content-card [card]="card"  (cardClick)="onCardClick($event)"></app-content-card>
                            </div>
                          </div>

                          <!-- VERTICAL (stacked cards) -->
                          <div class="d-flex flex-column" *ngIf="section.isVerticalCards">
                            <div *ngFor="let card of getDisplayCards(section)" class="mb-3" style="width: 100%;">
                              <!-- For stacked cards we want full width -->
                              <div style="width: 100%;">
                                <!-- Special layout for Life stories and Blogs -->
                                <div *ngIf="section.rawSectionType === 2" 
                                     class="story-blog-card d-flex align-items-center p-3 cursor-pointer" 
                                     style="background-color: rgba(255, 232, 187, 1);"
                                     (click)="onCardClick(card)">
                                  <div class="me-3" style="flex-shrink: 0;">
                                    <img [src]="card.imageUrl" 
                                         [alt]="card.title" 
                                         class="rounded" 
                                         style="width: 60px; height: 60px; object-fit: cover;">
                                  </div>
                                  <div class="flex-grow-1">
                                    <h6 class="mb-1 fw-bold">{{ card.title }}</h6>
                                    <p class="mb-0 text-muted small" 
                                       [innerHTML]="card.subtitle" 
                                       style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                    </p>
                                  </div>
                                </div>
                                <!-- Default card layout for other sections -->
                                <app-content-card *ngIf="section.rawSectionType !== 2"
                                                  [card]="card" 
                                                  (cardClick)="onCardClick($event)">
                                </app-content-card>
                              </div>
                            </div>
                          </div>
                          
                          <!-- View All/View Less buttons for Life stories and Blogs -->
                          <div *ngIf="shouldShowViewAll(section) || shouldShowViewLess(section)" class="text-center mt-3">
                            <button *ngIf="shouldShowViewAll(section)" 
                                    class="btn btn-link text-decoration-underline view-toggle-btn" 
                                    (click)="onViewAllClick(section)">
                              View all <i class="fas fa-chevron-down ms-1"></i>
                            </button>
                            <button *ngIf="shouldShowViewLess(section)" 
                                    class="btn btn-link text-decoration-underline view-toggle-btn" 
                                    (click)="onViewLessClick(section)">
                              View less <i class="fas fa-chevron-up ms-1"></i>
                            </button>
                          </div>
                        </div>

                        <!-- If this inline section has nested childSections (rare), render them too as inline by default -->
                        <div *ngIf="section.childSections && section.childSections.length" class="mt-3 nested-sections">
                          <div *ngFor="let child of section.childSections">
                            <ng-container *ngTemplateOutlet="renderSection; context: { $implicit: child }"></ng-container>
                          </div>
                        </div>
                      </div>
                    </ng-container>

                    <!-- Accordion header + content for normal sections -->
                    <ng-template #accordionHeader>
                      <!-- Section Header (clickable for accordion) -->
                      <div class="d-flex justify-content-between align-items-center p-3 section-header rounded-top border-bottom cursor-pointer"
                           [class.long-term-solutions-header]="section.title === 'Long term solutions'"
                           (click)="onSectionToggle(section)"
                           (keydown.enter)="onSectionToggle(section)"
                           (keydown.space)="onSectionToggle(section)"
                           tabindex="0"
                           role="button"
                           [attr.aria-expanded]="section.isExpanded"
                           [attr.aria-controls]="'section-' + section.id">
                        <div class="d-flex flex-column">
                          <h5 class="mb-0 section-title" [id]="'section-title-' + section.id">{{ section.title }}</h5>
                          <span class="text-muted" *ngIf="section.subtitle && !(section.title === 'Begin Here' && section.isExpanded)">{{ section.subtitle }}</span>
                        </div>
                        <div class="text-muted">
                         <span class="chev" *ngIf="section.isExpanded">></span>  <!-- use › or > or < -->
                          <span class="chev-rot" *ngIf="!section.isExpanded"><</span>
                        </div>
                      </div>

                      <!-- Section Content -->
                      <div class="rounded-bottom"
                           [class.long-term-solutions-content]="section.title === 'Long term solutions'"
                           [@slideDown]="section.isExpanded ? 'expanded' : 'collapsed'"
                           [id]="'section-' + section.id"
                           role="region"
                           [attr.aria-labelledby]="'section-title-' + section.id">
                        <div [class.p-3]="section.title !== 'Long term solutions'" [class.p-0]="section.title === 'Long term solutions'">
                          <!-- Horizontal vs Vertical card layout for accordion content as well -->
                          <div *ngIf="section.cards && section.cards.length">
                            <div class="d-flex card-container" 
                                 [class.p-3]="section.title !== 'Long term solutions'"
                                 [class.px-3]="section.title === 'Long term solutions'"
                                 [class.py-3]="section.title === 'Long term solutions'"
                                 *ngIf="!section.isVerticalCards">
                              <div *ngFor="let card of getDisplayCards(section)" 
                                   [class.me-3]="section.title !== 'Long term solutions'"
                                   [class.mr-3]="section.title === 'Long term solutions'"
                                   style="min-width: 200px; flex-shrink: 0;">
                                <app-content-card [card]="card"  (cardClick)="onCardClick($event)"></app-content-card>
                              </div>
                            </div>

                            <div class="d-flex flex-column" 
                                 [class.p-3]="section.title !== 'Long term solutions'"
                                 [class.px-3]="section.title === 'Long term solutions'"
                                 [class.py-3]="section.title === 'Long term solutions'"
                                 *ngIf="section.isVerticalCards">
                              <div *ngFor="let card of getDisplayCards(section)" class="mb-3" style="width: 100%;">
                                <div style="width: 100%;">
                                  <!-- Special layout for Life stories and Blogs -->
                                  <div *ngIf="section.rawSectionType === 2" 
                                       class="story-blog-card d-flex align-items-center p-3 cursor-pointer" 
                                       style="background-color: rgba(255, 232, 187, 1);"
                                       (click)="onCardClick(card)">
                                    <div class="me-3" style="flex-shrink: 0;">
                                      <img [src]="card.imageUrl" 
                                           [alt]="card.title" 
                                           class="rounded" 
                                           style="width: 60px; height: 60px; object-fit: cover;">
                                    </div>
                                    <div class="flex-grow-1">
                                      <h6 class="mb-1 fw-bold">{{ card.title }}</h6>
                                      <p class="mb-0 text-muted small" 
                                         [innerHTML]="card.subtitle" 
                                         style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                      </p>
                                    </div>
                                  </div>
                                  <!-- Default card layout for other sections -->
                                  <app-content-card *ngIf="section.rawSectionType !== 2"
                                                    [card]="card" 
                                                    (cardClick)="onCardClick($event)">
                                  </app-content-card>
                                </div>
                              </div>
                            </div>
                            
                            <!-- View All/View Less buttons for Life stories and Blogs -->
                            <div *ngIf="shouldShowViewAll(section) || shouldShowViewLess(section)" 
                                 class="text-center mt-3"
                                 [class.px-3]="section.title === 'Long term solutions'"
                                 [class.py-2]="section.title === 'Long term solutions'">
                              <button *ngIf="shouldShowViewAll(section)" 
                                      class="btn btn-link text-decoration-underline view-toggle-btn" 
                                      (click)="onViewAllClick(section)">
                                View all <i class="fas fa-chevron-right ms-1"></i>
                              </button>
                              <button *ngIf="shouldShowViewLess(section)" 
                                      class="btn btn-link text-decoration-underline view-toggle-btn" 
                                      (click)="onViewLessClick(section)">
                                View less <i class="fas fa-chevron-right ms-1"></i>
                              </button>
                            </div>
                          </div>
                          
                          <!-- Show message if no cards -->
                          <!-- <div *ngIf="!section.cards || !section.cards.length" class="text-muted text-center p-3">
                            No cards available for this section
                          </div> -->

                          <!-- child sections (these may be inline or accordion depending on their flag) -->
                          <div *ngIf="section.childSections && section.childSections.length" 
                               class="mt-3 nested-sections"
                               [class.px-3]="section.title === 'Long term solutions'"
                               [class.py-2]="section.title === 'Long term solutions'">
                            <div *ngFor="let child of section.childSections">
                              <ng-container *ngTemplateOutlet="renderSection; context: { $implicit: child }"></ng-container>
                            </div>
                          </div>

                        </div>
                      </div>
                    </ng-template>

                  </div>
                </ng-template>

                <!-- Top-level sections -->
                <div *ngFor="let section of contentSections">
                  <ng-container *ngTemplateOutlet="renderSection; context: { $implicit: section }"></ng-container>
                </div>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
