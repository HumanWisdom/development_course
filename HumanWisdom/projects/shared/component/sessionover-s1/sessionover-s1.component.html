<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_03" role="main">
  <!-- Class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 center_flex bg_stake col_cw">
        <div class="x_panel p0 center_flex">
          <div class="x_content p0">
            <form>

              <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 center_flex pb20px">
                  <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/session_end_owl.svg" alt="" class="img-responsive animate_rotate_scale  ">
                  <div class="prelative center_flex">
                    <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/wisdom_points_circle_02.svg" alt="" class="prelative">
                    <h6 class="fw_700 fs_32px lh_100p  se_wpts_count center_flex fc_ffffff"  >
                      {{points}}
                    </h6>
                  </div>
                </div>
              </div>

              <h1 class="fw_600 fs_32px lh_150p  tcenter wp_txt" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                Well done!
              </h1>

              <h1 class="fw_400 fs_15px lh_150p  tcenter" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                You’ve earned {{points}} points. Check your Profile for more details.
              </h1>

              <ng-content></ng-content>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/Class -->
</div>
<!-- /page content -->
