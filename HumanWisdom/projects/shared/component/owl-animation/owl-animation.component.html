<div (click)="openChat()" class="owl-animation-wrapper" style="width: 15%;height: 15%;z-index: 999;"
     [ngClass]="{'center': isPlaying || isTransitioning, 'corner': isAtCorner, 'transitioning': isTransitioning}">
   
<video
  #videoElement
  class="owl-video"
  autoplay
  playsinline
  preload="auto"
  webkit-playsinline
  x5-playsinline
  x5-video-player-type="h5"
  x5-video-player-fullscreen="false"
  draggable="false"
  poster="">
  <source src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/videos/final.webm" type="video/webm">
  <!-- <source src="assets/video/final.webm" type="video/webm">
  <source src="assets/video/final.mov" type="video/quicktime"> -->
  Your browser does not support the video tag.
</video>




  <!-- Debug Info (remove in production) -->
  <div class="debug-info" *ngIf="videoError">
    <p>Video Error: WebM format may not be supported in this browser</p>
    <p>Please check browser compatibility or use MP4 format as fallback</p>
  </div>

  <!-- Loading indicator -->
  <div class="loading-indicator" *ngIf="!videoLoaded && !videoError && !isAtCorner">
    <p>Loading owl animation...</p>
  </div>
</div>
