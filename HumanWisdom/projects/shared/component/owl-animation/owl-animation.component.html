<div *ngIf="showOwl" (click)="openChat()" class="owl-animation-wrapper"
     [ngClass]="{'center': isPlaying || isTransitioning, 'corner': isAtCorner, 'transitioning': isTransitioning}">
   
<!-- Static Owl Image with Customizable Text - Shows after video ends -->
<div class="static-owl-container" *ngIf="showStaticOwl">
  <img 
    #staticOwlImage
    [src]="staticOwlUrl" 
    alt="Olly the Owl" 
    class="static-owl-image"
    (load)="onStaticOwlImageLoaded()"
  />
  <div class="owl-cloud-container" *ngIf="showCloudMessage" [ngClass]="{'speaking': isSpeaking, 'disappearing': isDisappearing, 'fade-in': cloudFadeIn}">
    <img 
      [src]="currentCloudImage" 
      alt="Olly Hi" 
      class="cloud-image"
    />
  </div>
</div>

</div>
