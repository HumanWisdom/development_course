<div *ngIf="showOwl" (click)="openChat()" class="owl-animation-wrapper"
     [ngClass]="{'center': isPlaying || isTransitioning, 'corner': isAtCorner, 'transitioning': isTransitioning}">
   
<!-- Static Owl Image with Customizable Text - Shows after video ends -->
<div class="static-owl-container" *ngIf="showStaticOwl">
  <img 
    src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/icons/owlwingsdown.png" 
    alt="Olly the Owl" 
    class="static-owl-image"
  />
  <div class="owl-cloud-container" *ngIf="owlMessage || isDisappearing" [ngClass]="{'speaking': isSpeaking, 'disappearing': isDisappearing}">
    <img 
      src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/images/icons/animatedCloud.png" 
      alt="Cloud" 
      class="cloud-image"
    />
    <div class="cloud-text">
      {{ owlMessage }}
    </div>
  </div>
</div>

<!-- Animated GIF - Plays only on home page and only once (fallback) -->
<img
  #gifElement
  class="owl-gif"
  *ngIf="showGif && !showStaticOwl"
  [src]="gifUrl"
  alt="Animated Owl"
  draggable="false"
  (load)="onGifLoaded()"
  (error)="handleGifError()"
/>

  <!-- Debug Info (remove in production) -->
  <div class="debug-info" *ngIf="gifError">
    <p>GIF Error: Unable to load the animation</p>
    <p>Please check the connection or URL</p>
  </div>

  <!-- Loading indicator -->
  <!-- <div class="loading-indicator" *ngIf="!gifLoaded && !gifError">
    <p>Loading owl animation...</p>
  </div> -->
</div>
