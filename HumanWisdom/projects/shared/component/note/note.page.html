<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 tn_title_back col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a>
        <img
          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/arrow_left.svg"
          (click)="goBack()" (keydown)="goBack()"
          alt=""
          class="p0" *ngIf="!isAdults"
        />
         <img
          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/back.svg"
          (click)="goBack()" (keydown)="goBack()"
          alt=""
          class="p0" *ngIf="isAdults"
        />
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1
        class="fw_600 fs_18px lh_140p mtb0px tcenter"
        [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'"
      >
        Note
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
      <a (click)="save()" *ngIf="enableSave">
        <img
          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/tick_save.svg"
          alt=""
          class="p0" *ngIf="!isAdults"
        />
         <img
          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/tick_save.svg"
          alt=""
          class="p0" *ngIf="isAdults"
        />
      </a>
    </div>
  </div>
</div>
<!-- /top navigation -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01">
  <div class="cw100p">
    <div class="row center_flex">
      <div
        class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw"
        [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'"
      >
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <div class="row pb20px">
                <div class="col-md-12 p0">
                  <textarea
                    id="first-name"
                    required
                    [readonly]="readOnly"
                    [ngClass]="readOnly ? 'form-control cfc_v3_01 tleft' : 'form-control cta1 tleft'"
                    name="title"
                    [(ngModel)]="title"
                    placeholder="Title"
                    rows="3"
                  ></textarea>
                </div>
              </div>

              <div class="row pb20px" *ngIf="urlType === 'note'">
                <div class="col-md-12 p0">
                  <textarea
                    class="form-control cta1"
                    (ngModelChange)="dataChanged($event)"
                    rows="10"
                    placeholder="Not sure what to write? Here are some cues to get you started.
1. What habit could you change to make your life better?
2. What are you grateful for today?
3. What was the highlight of your day?
4. What did you learn about yourself today?
5. What is the kind thing you did today?"
                    name="notes"
                    [(ngModel)]="notes"
                  ></textarea>
                </div>
              </div>

              <div class="row pb20px" *ngIf="urlType !== 'note'">
                <div class="col-md-12 p0">
                  <textarea
                    class="form-control cta1"
                    (ngModelChange)="dataChanged($event)"
                    rows="10"
                    placeholder="Start writing..."
                    name="notes"
                    [(ngModel)]="notes"
                  ></textarea>
                </div>
              </div>

            
              <button
                type="button"
                style="display: none"
                #successbtn
                data-bs-toggle="modal"
                data-bs-target="#successfully_saved"
              ></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->

<!-- footer -->
<app-bottom-navigation></app-bottom-navigation>
<!-- /footer -->

<app-modal [modalid]="'save_changes'" *ngIf="enableAlert"  (closeEvent)="Save($event)" [okText]="'Save'" [cancelText]="'Discard changes'" [enableCancel]="true"
  [title]="'Save changes'" [content]="'Do you want to save the changes?'" data-bs-dismiss="modal" >
</app-modal>

<app-modal *ngIf="enableSuccessAlert"  (closeEvent)="save_continue($event)" [okText]="'Continue'"   [enableCancel]="false"
  [title]="'Successfully saved'" data-bs-dismiss="modal"  >
</app-modal>
<!-- Successfully Saved Modal -->
  id="successfully_saved"
  tabindex="-1"
  aria-hidden="true"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
>
  <div class="modal-dialog modal-dialog-centered">
    <div
      class="modal-content"
      [ngClass]="isAdults ? 'bg-white text-dark' : 'bg-dark text-white'"
    >
      <div class="row mb20px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
          <img 
            src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/v3_tick_successfull.svg"
            class="img-responsive" alt="success"
          />
