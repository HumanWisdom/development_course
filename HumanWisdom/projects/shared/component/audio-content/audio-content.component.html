<app-bg-video></app-bg-video>


<!-- page content -->
<div class="right_col mc_02" #screen role="main">
  <!-- Class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_02_v3 bg_stake col_cw">
        <div
          [ngClass]="[pageaction === 'next' ? 'x_panel xpanel_01 ' : pageaction === 'prev' ? 'x_panel xpanel_01 p0' : 'x_panel xpanel_01 p0' ]">
          <div class="x_content p0">
            <form>

              <div id="transcriptDiv" class="row mt10px mb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 tcenter"  (click)="gotoTranscript()">
                  <a class="">
                    <!-- <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/transcript_left.svg" class="img-responsive" alt=""> -->
                    <h6 class="fs_15px fw_400 lh_140p underline"  [ngClass]="isAdults? 'fc_D7586B': 'fc_e58d82'"  >
                      Read text
                    </h6>
                  </a>
                </div>
              </div>

              <h1 class="txt1">
                {{title}}
              </h1>

              <!-- jquery audio player plugin  -->
              <!-- <div class="row tcenter">
                <div class="col-md-12 col-sm-12 col-xs-12">
                  <div #playerContainer id="playerContainer" class=""></div>
                </div>
              </div> -->
              <!-- jquery audio player plugin  -->

              <!-- angular audio player plugin  -->
              <!--
              <ngx-circular-player id="aud1" [source]="audioLink" (click)="getTime()" #audio></ngx-circular-player>
              -->
              <div class="row tcenter">
                <div class="col-md-12 col-sm-12 col-xs-12 center_flex p0 ">
                  <!-- <audio id="aud1" controls controlsList="nodownload" #audio 
                  [ngClass]="[isAdults ? 'invert-controls' : '']">
                    <source [src]="audioLink" type="audio/mpeg">
                  </audio> -->
                   <app-audio-player  id="aud1"  
                        [ngClass]="[isAdults ? 'invert-controls' : '']"
                                [audioLink]="audioLink">
                              </app-audio-player> 
                     </div>
              </div>
              <!-- /angular audio player plugin  -->

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/Class -->
</div>
<!-- /page content -->

<app-modal *ngIf="enableAlert" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'"
  [content]="'You have reached your free limit. Start your free trial to Premium to  unlock full access to the app'">
</app-modal>
