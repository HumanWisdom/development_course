<title>Events | HumanWisdom</title>

<!-- top navigation -->
<app-feature-header title="Events"></app-feature-header>
<!-- /top navigation -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <!-- search -->
              <div class="row prelative">
                <div class="col-md-12 col-sm-12 col-xs-12 form-group has-feedback zi0 p0 mb0px">
                  <input type="search" class="form-control has-feedback-left pfy_search hide_search"
                    placeholder="Search video" name="search-list" autocomplete="off" [(ngModel)]="searchinp"
                    (focusout)="getSearchResult($event.target.value)"
                    (keyup.enter)="getSearchResult($event.target.value)" [ngStyle]="{'border-radius':'100px'}" />
                  <span class="fa fa-search form-control-feedback left pfy_search_icon" aria-hidden="true">
                  </span>
                  <span *ngIf=" searchinp!=''" (click)="clearSearch()" (keydown.enter)="clearSearch()" tabindex="0"
                    class="fa fa-search form-control-feedback ad_sclose_icon ad_sclose_icon_ext" aria-hidden="true">
                  </span>
                </div>
                <div class="col-md-12 col-sm-12 col-xs-12 p0"></div>
              </div>
              <!-- /search -->

              <div class="row mtb30px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_15px fw_400 lh_150p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    This is a link to our LIVE events, with guests from around
                    the world. Each offers fresh ways of dealing with life’s
                    challenges and living your best life.
                  </h4>
                </div>
              </div>

              <!-- accordion -->
              <div class="row center_flex" *ngIf="futureeventList.length !== 0">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                  <div class="accordion panel-group" id="accordion_event">
                    <div class="accordion-item panel panel-default">
                      <h2 class="accordion-header panel-heading" id="heading_01">
                        <button
                          class="accordion-button mtb0px fs_18px fw_600 lh_24px d-flex justify-content-between align-items-center"
                          type="button" (click)="toggleEventsAccordion()" [attr.aria-expanded]="isEventsOpen"
                          [class.collapsed]="!isEventsOpen" aria-controls="collapse_01">
                          Upcoming Free Events
                          <i class="fa" [ngClass]="{'fa-angle-up': !isEventsOpen, 'fa-angle-down': isEventsOpen}"></i>
                        </button>
                      </h2>
                      <div id="collapse_01" class="accordion-collapse panel-collapse"
                        [ngClass]="{'collapse': true, 'show': isEventsOpen}" aria-labelledby="heading_01">
                        <div class="accordion-body panel-body">
                          <div class="row">
                            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                              <div class="toc_adiv_02">
                                <!-- video row -->
                                <a (click)="routeFutureEvents(item)" *ngFor="let item of futureeventList">
                                  <div class="row mb0pxi p10px">
                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                                      <div class="col-md-4 col-sm-4 col-xs-4 p0 prelative text-center">
                                        <img src="{{item.ImgUrl}}" alt="" class="p0 session_img session_imgnew" />
                                        <!-- <img
src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/play_border_0.svg"
                                            alt="" class="p0 session_img_play"> -->
                                      </div>

                                      <div class="col-md-7 col-sm-7 col-xs-7 p0"
                                        [style.margin-left]="isIos ? '16px' : '0px'">
                                        <h4 class="mt0px mb5px fs_15px fw_500 lh_130p ellipsis"
                                          [ngClass]="isAdults? 'fc_000000': 'fc_e58d82'">
                                          {{item.Title}}
                                        </h4>
                                        <h4 class="mtb0px fs_12px fw_400 lh_130p"
                                          [ngClass]="isAdults? 'fc_000000': 'fc_ffffff_0_5'">
                                          {{item.Event_Date}}
                                        </h4>
                                      </div>

                                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright">
                                        <!-- <i
                                          class="fa fa-angle-right fs_20px"
                                          [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'"
                                        ></i> -->
                                      </div>
                                    </div>
                                  </div>
                                </a>
                                <!-- /video row -->
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- /accordion -->

              <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <hr class="hr_style_v3_02" />
                </div>
              </div>

              <div class="row mb20px">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_18px fw_600 lh_24px" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    Past events
                  </h4>
                </div>
              </div>

              <div class="toc_adiv_02">
                <!-- video row -->
                <a (click)="youtube(item.YoutubeLink, item.RowID, item.Title)" *ngFor="let item of eventList">
                  <div class="row ">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                      <div class="col-md-4 col-sm-4 col-xs-4 p0 prelative text-center">
                        <img src="{{item.ImgUrl}}" alt="" class="p0 session_img session_imgnew" />
                        <img class="session_img_play" [src]="
                          isAdults
                            ? 'https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/audio_play.svg'
                            : 'https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/play_border_0.svg'
                        " alt="Overlay icon" />
                      </div>

                      <div class="col-md-7 col-sm-7 col-xs-7 p0" [style.margin-left]="isIos ? '16px' : '0px'">
                        <h4 class="mt0px mb5px fs_15px fw_500 lh_130p ellipsis"
                          [ngClass]="isAdults? 'fc_000000': 'fc_e58d82'">
                          {{item.Title}}
                        </h4>
                        <h4 class="mtb0px fs_12px fw_400 lh_130p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff_0_5'">
                          {{item.Timing}} min
                        </h4>
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright"
                        *ngIf="!isSubscriber && item.RowID <= 1">
                        <img *ngIf="item?.isRead === '1'"
                          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/isRead.svg"
                          class="img-responsive ws-read-icon" />
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright" *ngIf="isSubscriber">
                        <img *ngIf="item?.isRead === '1'"
                          src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/isRead.svg"
                          class="img-responsive ws-read-icon" />
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright"
                        *ngIf="!isSubscriber && item.RowID > 1">
                        <!-- lock -->
                        <img *ngIf="!isSubscriber"
                          [src]="isAdults ? 'https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/lock_section2.svg' : 'https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/lock.svg'"
                          class="img-responsive ws-lock-icon" />
                        <!-- /lock -->
                      </div>
                    </div>
                  </div>
                </a>
                <!-- /video row -->
              </div>

              <div class="pagebreak"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/class -->
</div>
<!-- /page content -->

<app-modal *ngIf="showModal" [title]="modalTitle" [content]="modalContent" [okText]="'Start your free trial'"
  [cancelText]="'Cancel'" [enableCancel]="true" [isFreeTrialEnable]="true"
  (closeEvent)="onModalClose($event)"></app-modal>

<!-- footer  -->
<app-bottom-navigation></app-bottom-navigation>
<!-- /footer -->
