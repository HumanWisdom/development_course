  <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 toc_nvmenu_v3 col_cw">
      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tleft">
        <a (click)="goBack()" class="">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/back_round.svg" alt="" class="p0" *ngIf="!isAdults"> 
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0" *ngIf="isAdults">
        </a>
      </div>
  
      <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
        <a class="">
          <h4 class="mtb0px fs_18px fw_600 lh_130p  tcenter"  [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'" >
           Events
          </h4>
        </a>
      </div>
  
      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
        <a id="btnShare" (click)="share()">                                       
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/share_round.svg" alt="" class="p0" *ngIf="!isAdults"> 
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/share.svg" alt="" class="p0" *ngIf="isAdults">
        </a>
      </div>
    </div>
  </div>
   <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 p0 col_cw cptrem bg_stake">
      <img [src]="tocImage"  alt="eventImg" class="img-responsive w100 adults_index_img1" >
    </div>
  </div>


<app-index-content>


  <div class="row mt20px">
    <div class="col-md-12 col-sm-12 col-xs-12 p0">
      <h1 class="mtb0px fs_24px fw_600 lh_150p" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        {{eventData['Title']}}
      </h1>
    </div>
  </div>

  <div class="row mtb20px">
    <div class="col-md-12 col-sm-12 col-xs-12 p0">
      <h4 class="mtb0px fs_15px fw_400 lh_150p" [innerHTML]="eventData['EventDesc']" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        description
      </h4>
    </div>
  </div>

  <div class="row mb5px">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0" style="opacity: 50%;">
      <h4 class="mtb0px fs_12px fw_400 lh_150p flex_ai" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/event_date.svg"
          class="img-responsive mr5px" *ngIf="!isAdults">
           <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/event_date.svg"
          class="img-responsive mr5px" *ngIf="isAdults">
        Date: {{eventData['Event_Date']}}
      </h4>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0" style="opacity: 50%;" >
      <h4 class="mtb0px fs_12px fw_400 lh_150p flex_ai" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/event_time.svg"
          class="img-responsive mr5px" *ngIf="!isAdults">
            <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/event_time.svg"
          class="img-responsive mr5px" *ngIf="isAdults">
        {{eventData['EventTiming']}}.
      </h4>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12 col-sm-12 col-xs-12 p0"  >
      <hr class="hr_style_v3_05 mtb30px">
    </div>
  </div>

  <div *ngIf="enableRegister">
    <div class="row mb20px">
      <div class="col-md-12 col-sm-12 col-xs-12 p0">
        <h4 class="mtb0px fs_18px fw_600 lh_140p" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
          Register Here
        </h4>
      </div>
    </div>

    <div class="row mb10px">
      <div class="col-md-12 col-sm-12 col-xs-12 p0 prelative">
        <input type="text" class="sp_fc" placeholder="Name" required [(ngModel)]="name">
        <div class="fc_img">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/svg_user.svg"
            class="img-responsive" *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/svg_user.svg"
            class="img-responsive" *ngIf="isAdults">
        </div>
      </div>
      <small class="text danger ml-10 p0" [ngClass]="isAdults ? '' : 'fc_ffffff_0_5'">{{namevalidation()}}</small>
    </div>

    <div class="row mb10px">
      <div class="col-md-12 col-sm-12 col-xs-12 p0 prelative">
        <input type="text" class="sp_fc" placeholder="Email address" required [(ngModel)]="email">
        <div class="fc_img">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/svg_email.svg"
            class="img-responsive" *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/svg_email.svg"
            class="img-responsive" *ngIf="isAdults">
        </div>
      </div>
      <small class="text danger ml-10 p0" [ngClass]="isAdults ? '' : 'fc_ffffff_0_5'">{{emailvalidation()}}</small>
    </div>

    <div class="row mt20px">
      <div class="col-md-12 col-sm-12 col-xs-12 p10">
        <h6 class="fw_700 fs_12px lh_14px mt0px" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
          Whatsapp/Phone Number(Optional)
        </h6>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12 col-sm-12 col-xs-12 p0">
        <div class="col-md-3 col-sm-3 col-xs-3 p0">
          <input type="text" maxlength="4" name="name" class="sp_fc" placeholder="+XX" [(ngModel)]="isdcode" maxlength="5" >
        </div>
        <div class="col-md-9 col-sm-9 col-xs-9 pr0px">
          <input type="text" name="name" class="sp_fc" placeholder="XXX-XXX-XXXX" [(ngModel)]="phoneno" maxlength="12" >
        </div>
      </div>
    </div>

    <div *ngIf="checkValidPhoneNo()" class="alert-danger w100 alerClass">
      Please Enter Valid Phone No or ISD Code
    </div>
<!--     <div class="col-md-10 col-sm-10 col-xs-9 pr0px">
      <input type="text"  maxlength="12" required="required" name="ContactNo" class="sp_fc feedback_left cfc10_fl_p" placeholder="">
      <span id="phoneCode" class="form-control-feedback left cfc10_fl" aria-hidden="true"></span>
    </div> -->
 


    <div class="row center_flex mt30px">
      <div class="col-md-12 col-sm-12 col-xs-12 p0">
        <button type="button" class="btn btn_ctd" [disabled]="disabled()" (click)="registerEvent()">
          Register
        </button>
      </div>
    </div>
  </div>

  <div class="pagebreak"></div>

  <app-modal *ngIf="enableAlert" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'" [content]="content">
  </app-modal>

</app-index-content>

<app-index-footer></app-index-footer>
