<!-- top navigation -->
<app-feature-header title="Blog"></app-feature-header>
<!-- /top navigation -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <!-- search -->
              <div class="row prelative">
                <!-- <div class="col-md-12 col-sm-12 col-xs-12 form-group has-feedback zi0 p0 mb0px">
                <input type="search" class="form-control has-feedback-left pfy_search hide_search searchtxt"  placeholder="Search for a topic" id="searchtxt_02" [(ngModel)]="this.searchedTitle" (ngModelChange)="searchTitle()">
                <span class="fa fa-search form-control-feedback left pfy_search_icon" aria-hidden="true"></span>
              </div> -->

                <app-hwp-search-bar [searchinp]="searchedTitle" [placeholder]="'Search for a topic'"
                  (textBoxEvent)="searchTitle($event)"></app-hwp-search-bar>

                <div class="col-md-12 col-sm-12 col-xs-12 p0"></div>
              </div>

              <!-- <div class="row prelative mt40px">
              <app-hwp-search-bar [searchinp]="searchedTitle"  [placeholder]="'Search for a topic'" (textBoxEvent)="searchTitle($event)" ></app-hwp-search-bar>

              <div class="col-md-12 col-sm-12 col-xs-12 p0"></div>
            </div> -->
              <!-- /search -->

              <div class="div_blogs mt15px">
                <!-- article 01 -->
                <a *ngFor="let item of filteredblogList" (click)="viewblog(item)">
                  <div class="row blog_bg">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <div class="row">
                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                          <img src="{{item['ImagePath']}}" alt="" class="img-responsive img_blog" />
                        </div>
                      </div>

                      <div class="row mt15px">
                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 flexai_baseline">
                          <div class="col-md-10 col-sm-10 col-xs-10 p0">
                            <h4 class="mtb0px fs_18px fw_600 lh_150p ellipsis"
                              [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                              {{item['Title']}}
                            </h4>
                          </div>
                          <div class="col-md-2 col-sm-2 col-xs-2 p0 tright center_flex">
                            <!-- READ icon (top-right) – only when read -->
                            <img *ngIf="item.isRead === '1' && isLoggedIn"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/isRead.svg"
                              class="mtb0px fs_15px fw_600 lh_150p blog_tick ml5px" alt="read" />
                          </div>
                        </div>
                      </div>

                      <div class="row mt10px mb15px">
                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                          <h4 class="mtb0px fs_12px fw_400 lh_150p limit_characters"
                            [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                            <span>{{stripTags(item['Story'])}}</span>
                          </h4>
                        </div>
                      </div>

                      <div class="row">
                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 flex_ai">
                          <h4 class="p0 col-md-10 col-sm-10 col-xs-10 mtb0px fs_12px fw_400 lh_150p"
                            [ngClass]="isAdults? 'fc_000000': 'fc_ffffff_0_5'">
                            {{timeSince(item['CreatedDate'])}}
                          </h4>
                          <div class="col-md-2 col-sm-2 col-xs-2 p0 tright center_flex">
                            <div class="div_like_cnt1">
                              <!-- <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/ls_like_filled_b.svg" alt=""> -->
                              <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/ls_like_filled_b.svg"
                                class="img-responsive" />

                              <span class="mtb0px fs_15px fw_600 lh_150p ml5px" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                                {{ item?.LikeCnt }}
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </a>
                <!-- /article 01 -->

                <div class="pagebreak"></div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/class -->
</div>
<!-- /page content -->

<!-- footer  -->
<app-bottom-navigation></app-bottom-navigation>
<!-- /footer -->
