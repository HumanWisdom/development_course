<title>Wellness Survey Introduction | HumanWisdom</title>

<app-bg-video></app-bg-video>


<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">

    <div class="row center_flex   mtb40px">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/well.svg" *ngIf="isAdults">
        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/well_teens.svg" *ngIf="!isAdults">
      </div>

    </div>

    <div class="row center_flex">
      <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
        <h4 class="mtb0px fs_32px fw_500 lh_130p  tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
          Welcome to HappierMe!
        </h4>
      </div>
    </div>
    <div class="row center_flex mtb20px">
      <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
        <h4 class="mtb0px fs_15px fw_400 lh_150p  tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
          Take a quick survey and find out your wellness score
        </h4>
      </div>
    </div>


    <div class="row mt30px mb40px">
      <div class="col-md-12 col-sm-12 col-xs-12 p0">

        <button type="submit" class="btn btn_e58d82" (click)="startSurvey()">Start survey</button>

      </div>
    </div>
  </div>
</div>
