<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_03" role="main">
  <!-- Class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 bg_stake col_cw">
        <div class="x_panel p0">
          <div class="x_content p0 tcenter">
            <form>

              <div class="row se_box mb20px">
                <div class="col-md-4 col-sm-4 col-xs-4 p0">
                  <button class="" (click)="routeJournal()" >
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <a>
                        <button type="button" class="btn btn-default mb0 btn_so" data-dismiss="modal">
                          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/icons/session_end_journal_02.svg" alt="">
                        </button>
                      </a>
                    </div>
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <h1 class="txt22 tcenter ">
                        Fill your journal
                      </h1>
                    </div>
                  </button>
                </div>

                <div class="col-md-4 col-sm-4 col-xs-4 p0">
                  <button class="" (click)="routeForum()">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <a>
                        <button type="button" class="btn btn-default mb0 btn_so" data-dismiss="modal">
                          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/icons/session_end_join_discussion.svg" alt="">
                        </button>
                      </a>
                    </div>
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <h1 class="txt22 tcenter ">
                        Join a discussion
                      </h1>
                    </div>
                  </button>
                </div>

          

                <div class="col-md-4 col-sm-4 col-xs-4 p0">
                  <button class=""  (click)="shareIndex()">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <button  id="btnShare" type="button" class="btn btn-default mb0 btn_so">
                        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/icons/session_end_share.svg" alt="">
                      </button>
                    </div>

                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <h1 class="txt22 tcenter ">
                        Share with Friends
                      </h1>
                    </div>
                  </button>
                </div>
              </div>

              <br>

              <div class="div_ns">
                <!-- radial progress bar  -->
                <div class="row tcenter">
                  <div class="col-md-12 col-sm-12 col-xs-12 prelative p10">
                    <a routerLink="/adults/adult-dashboard">
                      <circle-progress
                        [percent]="progressPercent"
                        [radius]="37.5"
                        [space]="0"
                        [outerStrokeWidth]="5"
                        [innerStrokeWidth]="0"
                        [outerStrokeColor]="'#E58D82'"
                        [innerStrokeColor]="'rgba(255,255,255,0.2)'"
                        [animation]="true"
                        [animationDuration]="300"
                        [showImage]="true"
                        [imageSrc]="progressImg"
                      >
                      </circle-progress>
                      <h4 class="fw_600 fs_15px lh_150p fc_ffffff absolute_flex_center">
                      {{progressText}}
                      </h4>
                    </a>
                  </div>
                </div>
                <!-- /radial progress bar -->

                <div class="row pt20px pb20px">
                  <div class="col-md-12 col-sm-12 col-xs-12 tcenter">
                    <button (click)="proceed()" type="button" class="btn btn-success mb0 btn_se" data-dismiss="modal">Continue to the next session</button>
                  </div>
                </div>

                <div class="row pb10px">
                  <div class="col-md-12 col-sm-12 col-xs-12  tcenter ">
                    <h4 class="mtb0px fw_600 fs_15px lh_150p fc_e58d82">
                      {{name}}
                    </h4>
                  </div>
                </div>
              </div>

                 <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pt30px">
                        <h4 class=" fs_15px fw_400 lh_150p fc_ffffff center_flex">
                        Complete all the sessions in this module to receive a certificate.
                        </h4>
                      </div>
                    </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/Class -->
</div>
<!-- /page content -->

<app-bottom-navigation></app-bottom-navigation>
