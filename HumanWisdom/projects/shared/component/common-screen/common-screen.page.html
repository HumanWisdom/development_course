<title>Short videos | Mental Wellness Apps | HumanWisdom</title>

<app-toc-header [moduleName]="this.config?.moduleName" [tocImage]="tocImage" [tocColor]="tocColor"></app-toc-header>

<!-- page content -->
<div class="right_col mc_01_v3 mc_01_v3_ext">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_292d56' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form >

              <!-- <div class="row ls_story_img">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 center_flex prelative">

                </div>

              <div class="row mt20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_18px fw_600 lh_150p fc_ffffff">
                    {{this.config?.moduleName}}
                  </h4>
                </div>
              </div>

              <div class="row mt10px mb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_15px fw_400 lh_150p fc_ffffff">
                    {{ this.config?.shortDescription }}
                  </h4>
                </div>
              </div>


              <!-- search -->
              <div class="row prelative">
                <app-hwp-search-bar [searchinp]="searchedText" (textBoxEvent)="searchShorts($event)" ></app-hwp-search-bar>

                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                </div>
              </div>
              <!-- /search -->

              <!-- <div class="row mr-20pxi mtb20px">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 odiv " [ngClass]="isAdults ? 'btn_podcast' : 'btn_podcast_t'">
                    <div class="col-md-12 col-sm-12 col-xs-12" > 
             
                   <ng-container *ngFor="let data of prefData">
                    <button type="button" class="btn" *ngIf="data['active'] && data['name'] === 'All'"
                     [ngStyle]="{'color': selectedPref === 'All' ? '#000' : '', 'background': selectedPref === 'All' ? '#fff' : '' }" (click)="getUserPref(data)">
                      {{data['name']}}
                    </button>

                    <button type="button" class="btn" *ngIf="data['active'] && data['name'] !== 'All'" (click)="getUserPref(data)">
                     {{data['name']}}
                   </button>

                  </ng-container>
                    </div>
                </div>
              </div> -->

              <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="title_content">
                    CONTENTS
                  </h4>
                </div>
              </div>

               <div class="toc_adiv_02">
                <!-- audio row -->
                <a *ngFor="let data of filteredData; let i=index" (click)="getClickEvent(data)">
                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">

                      <div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 p0">
                        <div class="prelative">
                          <div class="row">
                            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                              <img [src]="data['ImageUrl']" class="img-responsive w100 img_podcast_01">
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8">
                        <!-- <h4 class="mt0px mb5px fs_12px fw_400 lh_130p fc_ffffff">
                          Podcast #{{data['PodcastID']}}
                        </h4> -->
                        <h4 class="mt0px mb5px fs_15px fw_500 lh_130p fc_e58d82 ellipsis_01">
                          {{data['Title']}}
                        </h4>
                        <h4 class="mtb0px fs_12px fw_400 lh_130p fc_ffffff_0_5">
                          {{data['Timing']}} mins
                        </h4>
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright"
                        *ngIf="!isSubscriber && data['SoundscapeID'] <= 1">
                        <i class="fa fa-angle-right fc_ffffff fs_20px"></i>
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright" *ngIf="isSubscriber">
                        <i class="fa fa-angle-right fc_ffffff fs_20px"></i>
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright"
                        *ngIf="!isSubscriber && data['SoundscapeID'] > 1">
                        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/lock.svg"
                          class="img-responsive">
                      </div>


                    </div>
                  </div>
                </a>
                <!-- /audio row -->
              </div>

              <div class="pagebreak"></div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<!-- /page content -->

<app-index-footer></app-index-footer>
