<app-feature-header [title]="'Events'"></app-feature-header>

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_02">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_02_v3 center_flex bg_stake col_cw">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h1 class="txt1 tleft m0px" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">{{title}}</h1>
                </div>
              </div>

              <div class="row tcenter">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 pt30px" *ngIf="videoLink !== ''">
                  <div class="videowrapper">
                    <iframe [src]="videoLink" frameborder="0"></iframe>
                  </div>
                </div>
              </div>

            </form>

            <div class="pagebreak"></div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/class -->
</div>
<!-- /page content -->

<!-- footer  -->
<app-bottom-navigation [dash]="true" (journalclick)="getclcickevent($event)"></app-bottom-navigation>
<!-- /footer -->
