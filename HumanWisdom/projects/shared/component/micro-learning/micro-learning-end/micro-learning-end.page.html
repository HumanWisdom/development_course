<!-- top navigation -->
<div class="tn_bv" *ngIf="!isSubComponent">
  <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 toc_nvmenu_v3 col_cw"
      [ngClass]="isAdults ? 'bg_FFFFFF' : 'bg_stake'">
      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tleft">
        <a (click)="goToInnerScreen()" class="">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/back_round.svg" alt="" class="p0"
            *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0"
            *ngIf="isAdults">
        </a>
      </div>

      <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      </div>

      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
        <a id="btnShare" (click)="share()">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/share_round.svg" alt="" class="p0"
            *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/share.svg" alt="" class="p0"
            *ngIf="isAdults">
        </a>
      </div>
    </div>
  </div>
</div>
<!-- /top navigation -->

<div [class.right_col]="!isSubComponent" [class.mc_01_v3]="!isSubComponent">
  <div [class.cw100p]="!isSubComponent">
    <div [class.row]="!isSubComponent" [class.center_flex]="!isSubComponent">
      <div [class.col-lg-4]="!isSubComponent" [class.col-md-6]="!isSubComponent" [class.col-sm-6]="!isSubComponent"
        [class.col-xs-12]="!isSubComponent" [class.sc_01]="!isSubComponent" [class.col_cw]="!isSubComponent"
        [ngClass]="!isSubComponent ? (isAdults ? 'bg_FFF7E6' : 'bg_stake') : ''">

        <!-- Progress Bar at the top of content (only for standalone page) -->
        <div class="mc_progress_container" *ngIf="!isSubComponent">
          <div class="mc_progress_bar" [style.width.%]="100"></div>
        </div>

        <div [class.learning]="!isSubComponent" (touchstart)="!isSubComponent && handleTouchStart($event)"
          (touchmove)="!isSubComponent && handleTouchMove($event)"
          (touchend)="!isSubComponent && handleTouchEnd($event)"
          (mousedown)="!isSubComponent && handleTouchStart($event)"
          (mousemove)="!isSubComponent && handleTouchMove($event)" (mouseup)="!isSubComponent && handleTouchEnd($event)"
          (mouseleave)="!isSubComponent && handleTouchEnd($event)">

          <div class="mc_page_indicator" *ngIf="!isSubComponent && screensList.length > 0">
            {{screensList.length + 1}}/{{screensList.length + 1}}
          </div>

          <div [class.mc_content_wrapper]="!isSubComponent" [style.transform]="!isSubComponent ? getTransform() : ''"
            [class.is-dragging]="!isSubComponent && isDragging">
            <div [class.mc_scroll_content]="!isSubComponent">
              <!-- Yellow Background Card Container -->
              <div class="mc_end_container">

                <h2 class="mc_end_title" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                  What's your takeaway?<br>
                  How can you apply it today?
                </h2>

                <textarea class="mc_end_textarea" placeholder="Tap to answer" [(ngModel)]="journalText">
                </textarea>

                <button class="mc_end_btn_journal" (click)="addJournal()" [disabled]="!journalText">
                  Add to journal
                </button>

                <p class="mc_end_secure_text" [ngClass]="isAdults ? '' : 'fc_ffffff_0_5'">
                  Your online journal is secure and private to you
                </p>

                <div class="mc_end_divider"
                  [style.background]="isAdults ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)'"></div>

                <h3 class="mc_end_explore_title" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                  Explore the resources below to go deeper
                </h3>

                <!-- Resource Cards -->
                <ng-container *ngFor="let resource of resourcesList">
                  <div class="mc_end_resource_card" (click)="handleResourceClick(resource)">
                    <img [src]="resource.imgUrl" class="resource_img" [alt]="resource.title">
                    <div class="resource_info">
                      <h4>{{ resource.title }}</h4>
                      <p>{{ resource.type }}</p>
                    </div>
                  </div>
                </ng-container>

                <div class="row center_flex">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12  p0">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <a class="mtb10px fs_15px fw_500 lh_140p  tcenter td_underline dflex_start1"
                        [ngClass]="isAdults? 'fc_803358': 'fc_e58d82'" (click)="navigateToListing()">
                        Back to Micro learnings </a>
                    </div>
                  </div>
                </div>

                <div class="row center_flex">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12  p0">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                      <a class="mtb10px fs_15px fw_500 lh_140p  tcenter td_underline dflex_start1"
                        [ngClass]="isAdults? 'fc_803358': 'fc_e58d82'" (click)="goToHome()">
                        Go to Home </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Pagination and Navigation Footer (only for standalone page) -->
        <div class="mc_footer_container" *ngIf="!isSubComponent">
          <div class="row center_flex">
            <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 col_cw p0">
              <div class="mc_footer_section" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
                <div class="mc_end_footer_nav">
                  <a class="nav_btn active" (click)="goBack()">Prev.</a>

                  <div class="mc_end_pagination" *ngIf="screensList.length > 0">
                    <span class="dot" *ngFor="let screen of screensList"></span>
                    <span class="dot active"></span>
                  </div>

                  <a class="nav_btn" style="opacity: 0.5;">Next</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Success Popup Modal -->
<app-modal *ngIf="showSuccessPopup" (closeEvent)="closeSuccessPopup($event)" [okText]="'Continue'"
  [content]="'Successfully added'" [enableCancel]="false">
</app-modal>
