<app-toc-header
  [moduleName]="'Micro-learning'"
  [tocImage]="tocImage"
  [tocColor]="tocColor"
></app-toc-header>

<!-- page content -->
<div class="right_col mc_01_v3 mc_01_v3_ext" [ngClass]="{'adults-scroll': isAdults}">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <div class="row mt20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_18px fw_600 lh_150p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    Micro-learning
                  </h4>
                </div>
              </div>

              <!-- <div class="row mt10px mb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_15px fw_400 lh_150p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    Explore these concentrated nuggets of wisdom designed to fit into your busy schedule.
                  </h4>
                </div>
                
              </div> -->

              <!-- search -->
              <div class="row prelative">
                <app-hwp-search-bar
                  [searchinp]="searchedText"
                  (textBoxEvent)="searchMicroLearning($event)"
                ></app-hwp-search-bar>
              </div>
              <!-- /search -->

              <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="title_content" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    CONTENTS
                  </h4>
                </div>
              </div>

              <div class="toc_adiv_02">
                <ng-container *ngFor="let data of filteredList; let i=index">
                  <a (click)="navigateToInner(data)">
                    <div class="row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                        <div class="col-md-4 col-sm-4 col-xs-4 p0 prelative text-center">
                          <img src="{{data.imgUrl}}" alt="" class="p0 session_img session_imgnew" />
                        </div>

                        <div class="col-md-7 col-sm-7 col-xs-7">
                          <h4 class="mt0px mb5px fs_15px fw_500 lh_130p" [ngClass]="isAdults? 'fc_000000': 'fc_e58d82'">
                            {{data['title']}}
                          </h4>
                          <h4 class="mtb0px fs_12px fw_400 lh_130p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff_0_5'">
                            {{data['timing']}} min
                          </h4>
                        </div>

                        <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright">
                          <img *ngIf="data?.isRead === '1'" src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/isRead.svg" class="img-responsive ws-read-icon" />
                        </div>
                      </div>
                    </div>
                  </a>
                </ng-container>
              </div>

              <div class="pagebreak"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-index-footer></app-index-footer>
