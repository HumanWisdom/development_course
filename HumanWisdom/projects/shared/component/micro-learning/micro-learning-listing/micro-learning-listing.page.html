<title>Micro learnings | Mental Wellbeing Apps| HumanWisdom</title>


<!-- top navigation -->
<div class="tn_bv">

  <div class="row center_flex bg_bv">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 p0 col_cw img_podcast"
      [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
      <!-- <img src="https://d1tenzemoxuh75.cloudfront.net/assets/images/background/toc/51.webp" alt="" class="img-responsive w100"> -->
      <!-- <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/podcast.svg" alt="" class="img-responsive w100"> -->
    </div>
  </div>

  <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 toc_nvmenu_v3 col_cw">
      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tleft">
        <a (click)="goBack()" class="">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/back_round.svg" alt="" class="p0"
            *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0"
            *ngIf="isAdults">
        </a>
      </div>

      <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
        <a class="">
          <h4 class="mtb0px fs_18px fw_600 lh_130p tcenter" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
            Micro learnings
          </h4>
        </a>
      </div>

      <!-- <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
        <a id="btnShare" (click)="share()" data-toggle="dropdown" aria-expanded="false">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/share_round.svg" alt="" class="p0"
            *ngIf="!isAdults">
          <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/share.svg" alt="" class="p0"
            *ngIf="isAdults">
        </a>
      </div> -->
    </div>
  </div>
</div>


<app-bg-video></app-bg-video>
<!-- page content -->
<div class="right_col mc_01_v3 mc_01_v3_ext" [ngClass]="{'adults-scroll': isAdults}">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <!-- search -->
              <div class="row prelative mt10px">
                <app-hwp-search-bar [searchinp]="searchedText" [placeholder]="'Search for a topic'"
                  (textBoxEvent)="searchMicroLearning($event)"></app-hwp-search-bar>
                <div class="col-md-12 col-sm-12 col-xs-12 p0"></div>
              </div>
              <!-- /search -->



              <!-- overflow buttons -->
              <div class="row mtb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 odiv d-flex text-center"
                  [ngClass]="isAdults ? 'btn_podcast' : 'btn_podcast_t'">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 d-flex">
                    <ng-container *ngFor="let data of prefData">
                      <button type="button" class="btn" id="all" *ngIf="data['active'] && data['displayName'] === 'All'"
                        (click)="getUserPref('all')" [ngClass]="isAdults ? '' : 'bg-clr'">
                        {{data['displayName']}}
                      </button>

                      <button type="button" class="btn" id="{{data['id'] | lowercase }}"
                        *ngIf="data['active'] && data['displayName'] !== 'All'" (click)="getUserPref(data['id'])"
                        [ngClass]="isAdults ? '' : 'bg-clr'">
                        {{data['displayName']}}
                      </button>
                    </ng-container>
                  </div>
                </div>
              </div>
              <!-- /overflow buttons -->
              <!-- hr -->
              <!-- <div class="row ">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 plr20px">
                <hr class="hr_style_new">
              </div>
            </div> -->
              <!-- /hr -->
              <!-- hr -->
              <!-- <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 plr20px">
                <hr class="hr_style_v3_01">
              </div>
            </div> -->
              <!-- /hr -->
              <!-- <div class="row">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="title_content" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                    CONTENTS
                  </h4>
                </div>
              </div> -->

              <div class="toc_adiv_03">
                <ng-container *ngIf="!isLoading">
                  <ng-container *ngIf="filteredList.length > 0; else noResult">
                    <ng-container *ngFor="let data of filteredList; let i=index">
                      <a (click)="navigateToInner(data)">
                        <div class="row">
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                            <div class="col-md-4 col-sm-4 col-xs-4 p0 prelative">
                              <img src="{{data.imgUrl}}" alt="" class="p0 session_img session_imgnew" />
                            </div>

                            <div class="col-md-7 col-sm-7 col-xs-7 p0">
                              <h4 class="mt0px mb5px fs_15px fw_500 lh_130p"
                                [ngClass]="isAdults? 'fc_000000': 'fc_e58d82'">
                                {{data['title']}}
                              </h4>
                              <!-- <h4 class="mtb0px fs_12px fw_400 lh_130p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff_0_5'">
                              {{data['timing']}} min
                            </h4> -->
                            </div>
                            <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright">
                              <img *ngIf="data.isRead === '1'"
                                src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/isRead.svg"
                                class="ws-read-icon" alt="read">

                              <img *ngIf="!isSubscriber && data.isFree === '0'"
                                [src]="isAdults ? 'https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/lock_section2.svg' : 'https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/lock.svg'"
                                class="img-responsive ws-lock-icon" />
                            </div>
                          </div>
                        </div>
                      </a>
                    </ng-container>
                  </ng-container>
                </ng-container>

                <ng-template #noResult>
                  <div class="row mt20px">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0 tcenter">
                      <h4 class="fs_15px fw_400 lh_150p" [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">
                        No micro-learning found.
                      </h4>
                    </div>
                  </div>
                </ng-template>
              </div>

              <div class="pagebreak"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<app-modal *ngIf="showModal" [title]="modalTitle" [content]="modalContent" [okText]="'Start your free trial'"
  [cancelText]="'Cancel'" [enableCancel]="true" [isFreeTrialEnable]="true" (closeEvent)="onModalClose($event)">
</app-modal>

<app-index-footer></app-index-footer>
