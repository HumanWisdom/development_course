              <div class="row mt10px">
                <div class="col-12 plr0px prelative search-box-container" [class.search-box-hidden]="!showSearchBox">
                  <div class="col-md-12 col-sm-12 col-xs-12 form-group has-feedback zi0 p0 mb0px">
                    <input type="search" placeholder="Search for a topic"
                      class="form-control has-feedback-left pfy_search hide_search" name="search-list"
                      [(ngModel)]="searchedText" autocomplete="off" (keyup)="getAutoCompleteList($event.target.value)"
                      (focus)="onFocus()" (focusout)="onFocusOutEvent()"
                      (keyup.enter)="searchMicroLearning(searchedText)" style="border-radius: 100px !important;">
                    <span *ngIf="searchResult.length == 0"
                      class="fa fa-search form-control-feedback left pfy_search_icon" aria-hidden="true"></span>
                    <span *ngIf="searchResult.length > 0" (click)="clearSearch()"
                      class="fa fa-arrow-left form-control-feedback left pfy_search_icon pointer-events-auto"
                      aria-hidden="true" style="pointer-events: all !important; cursor: pointer !important;"></span>
                    <span *ngIf="searchedText!=''" (click)="clearSearch()"
                      class="fa fa-search form-control-feedback ad_sclose_icon ad_sclose_icon_ext"
                      aria-hidden="true"></span>
                  </div>

                  <!-- Search Dropdown -->
                  <div class="row adsearch" *ngIf="searchResult.length > 0">
                    <div class="col-md-12 col-sm-12 col-xs-12 tsp">
                      <ul class="list-group autocomplete-list adsearch_ul">
                        <li *ngFor="let item of searchResult" (click)="searchEvent(item.title)" name="list"
                          class="is-search list-group-item">
                          {{item.title}}
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
