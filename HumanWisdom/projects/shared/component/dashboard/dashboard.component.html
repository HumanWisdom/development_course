<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a class="" (click)="goBack()">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/arrow_left.svg" alt="" class="p0">
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0" >
      <h1 class="fw_600 fs_18px lh_140p fc_ffffff mtb0px tcenter ws_pre">
      {{dashboardData.title}}
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
    </div>
  </div>
</div>
<!-- /top navigation -->

<!-- page content -->
<div class="right_col mc_01">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw"
        [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
         <!--    <div class="row mt50px mb5px">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                <h4 class="mtb0px fw_600 fs_24px lh_140p fc_ffffff">
                  Hi, {{userName}}!
                </h4>
              </div>
            </div> -->
            <div class="row mb20px mt10px">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                <h4 class="mtb0px fw_400 fs_15px lh_140p fc_ffffff_0_5">
                  {{ introTitle }}
                </h4>
              </div>
            </div>
        <!--     <div class="row">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-10px">
                <hr class="hr_style_v3_02">
              </div>
            </div> -->
            <div class="toc_adiv_imgmy mb30px">
              <div *ngFor="let item of metadata">
                <ng-container *ngIf="item.data.length > 0">
                  <div class="row mb15px" >
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <h4 class="mtb0px fs_18px fw_600 lh_140p fc_ffffff">
                        {{ item.section_name }}
                      </h4>
                    </div>
                  </div>
                  <div *ngFor="let card of item.data">
                    <div class="row div_is_01 mb20px">
  
                      <app-section-card [section]="card"></app-section-card>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 mt-10px">
                      <hr class="hr_style_v3_02">
                    </div>
                  </div>
                </ng-container>
          

                <!-- hr -->
        


              </div>
              <div class="row mtb20px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0">
                  <button (click)="explore(introData.mainDashboardUrl)" type="submit" class="btn mdp_add_to_journal">
                    Explore complete section
                  </button>
                </div>
              </div>
            </div>
            <div class="pagebreak"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/class -->
</div>
<!-- /page content -->

<!-- footer -->
<app-bottom-navigation [dash]="true"></app-bottom-navigation>
<!-- /footer -->
