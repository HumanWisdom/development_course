<!-- top navigation -->
<div class="row center_flex">
  <div
    class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw"
    [ngClass]="isAdults ? 'bg_white' : 'bg_black'"
  >
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a (click)="goBack()">
        <img
          src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/arrow_left.svg"
          alt=""
          class="p0"
          *ngIf="!isAdults"
        />
        <img
          src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg"
          alt=""
          class="p0"
          *ngIf="isAdults"
        />
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0"></div>
  </div>
</div>
<!-- /top navigation -->
<div
  class="right_col mc_02"
  (swipeup)="onSwipeUp()"
  (swipedown)="onSwipeDown()"
  *ngIf="isSwipeAllow"
>
  <div class="cw100p">
    <div class="row center_flex">
      <div
        class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_03_v3 col_cw"
        [ngClass]="isAdults ? 'bg_white' : 'bg_black'"
      >
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <div class="video-slider-container">
                <div
                  class="video-wrapper"
                  *ngFor="let video of wisdomShortOrderList; let i = index"
                  [@slideAnimation]="
                    currentIndex === i
                      ? 'active'
                      : currentIndex > i
                      ? 'previous'
                      : 'next'
                  "
                  [style.zIndex]="currentIndex === i ? 1 : 0"
                >
                  <video
                    *ngIf="currentIndex === i"
                    playsinline
                    disablePictureInPicture
                    autoplay
                    class="cvideo"
                    [ngClass]="[
                      isIOS ? 'cvideo_ext_di_no_radius' : 'cvideo_ext_di'
                    ]"
                    #videoPlayer
                    controls
                    controlsList="nodownload nofullscreen"
                  >
                    <source [src]="video.url" type="video/mp4" />
                  </video>

                  <div
                    *ngIf="currentIndex === i"
                    class="swipe-up-alt"
                    [ngClass]="isAdults ? 'black-theme' : 'white-theme'"
                  >
                    <span class="text">Swipe for next</span>
                    <div class="chevron"></div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="right_col mc_02" #screen *ngIf="!isSwipeAllow">
  <div class="cw100p">
    <div class="row center_flex">
      <div
        class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_03_v3 col_cw"
        [ngClass]="
          isAdults
            ? !isSwipeAllow
              ? 'bg_FFF7E6'
              : 'bg_black'
            : !isSwipeAllow
            ? 'bg_183c79'
            : 'bg_black'
        "
      >
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>
              <h1
                class="txt1"
                [ngStyle]="{ color: isAdults ? 'black' : 'white' }"
              >
                {{ videoTitle }}
              </h1>
              <div class="row tcenter">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                  <video
                    playsinline
                    autoplay
                    disablePictureInPicture
                    class="cvideo"
                    [ngClass]="[
                      isIOS ? 'cvideo_ext_di_no_radius' : 'cvideo_ext_di'
                    ]"
                    #videoPlayer
                    controls
                    controlsList="nodownload nofullscreen"
                  >
                    <source [src]="videoLink" type="video/mp4" />
                  </video>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->
