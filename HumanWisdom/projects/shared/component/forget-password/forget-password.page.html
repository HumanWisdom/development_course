<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a class="" (click)="back()">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/arrow_left.svg" alt="" class="p0"
          *ngIf="!isAdults">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0" *ngIf="isAdults">
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1 class="fw_600 fs_18px lh_140p  mtb0px tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        Forgot password
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
    </div>
  </div>
</div>
<!-- /top navigation -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0">
            <form>

              <div class="mt30px mregister">
                <div class="row mb20px">
                  <div class="col-md-12 col-sm-12 col-xs-12 p0 prelative">
                    <input type="email" id="name" class="sp_fc" placeholder="Please enter email id"
                      (keyup)="emailKeyup($event.target.value)" (blur)="emailTouched = true" required>
                    <div class="fc_img">
                      <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/svg_email.svg"
                        class="img-responsive" *ngIf="!isAdults">
                      <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/svg_email.svg"
                        class="img-responsive" *ngIf="isAdults">
                    </div>
                  </div>
                  <div class="col-md-12 col-sm-12 col-xs-12 p0" *ngIf="emailTouched && email && !ValidateEmail()">
                    <p [ngClass]="isAdults ? 'fc_000000_0_5' : 'fc_ffffff_0_5'"
                      style=" margin-top: 5px; margin-bottom: 0px; font-size: 13px;">Please
                      Enter valid email id</p>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                  <button type="btn" class="btn btn_ctd" (click)="recoverPassword()"
                    [disabled]="email === undefined || email === '' || !ValidateEmail()">
                    Submit
                  </button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->

<app-modal *ngIf="enableAlert" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'" [content]="content">
</app-modal>
