<div *ngIf="enablewisdomstory" [class.adults_view]="isAdults">

  <div class="row index_rwst_title clickable" *ngIf="wisdomstories[0].length !== 0 && isAccordion"
    (click)="toggleAccordion()">
    <div class="col-md-12 col-sm-12 col-xs-12 center_flex">
      <div class="col-md-11 col-sm-11 col-xs-11 p0">
        <h4 class="fs_18px fw_600 lh_140p  mtb0px" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
          Related Life Stories
        </h4>
      </div>
      <div class="col-md-1 col-sm-1 col-xs-1 p0 tright">
        <i class="fa" [ngClass]="[isAdults ? 'fc_000000' : 'fc_ffffff', isOpen ? 'fa-angle-up' : 'fa-angle-down']"
          style="font-size: 18px; font-weight: 600;"></i>
      </div>
    </div>
  </div>

  <div class="row index_rwst_title" *ngIf="wisdomstories[0].length !== 0 && !isAccordion">
    <div class="col-md-12 col-sm-12 col-xs-12">
      <h4 class="fs_18px fw_600 lh_140p  mtb0px" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        Related Life Stories
      </h4>
    </div>
  </div>

  <!-- <div class="row index_rwst">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngFor="let data of wisdomstories">
    
      <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 prelative mb10px" *ngFor="let item of data">
        <a (click)="viewstory(item)">
          <img src="{{item['Img']}}" alt="" class="img-responsive img_index_rwst">
          <h4 class="mtb0px fw_500 fs_16px lh_19px fc_ffffff absolute_index_rwst_title tleft">
            {{item['Title']}}
          </h4>
        </a>
      </div>
      
    </div>
  </div> -->

  <div *ngIf="!isAccordion || isOpen">
    <div class="row mt20px">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 msrow" *ngFor="let data of wisdomstories">

        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6" *ngFor="let item of data">
          <a (click)="viewstory(item)">
            <div class="box_v3_04a" style="margin-left: 0; margin-right: 0; margin-bottom: 10px !important;">
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">

                <div class="row">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                    <img src="{{item['Img']}}" class="img-responsive">
                  </div>
                </div>

                <div class="row">
                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                    <h4 class="mt10px mb10px fw_500 fs_12px lh_130p " [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
                      {{item['Title']}}
                    </h4>
                  </div>
                </div>

              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
