<!-- top navigation -->
<app-feature-header title="Share with a friend" [hideShare]="true"></app-feature-header>
<!-- /top navigation -->

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01">
  <!-- Class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 bg_FFF7E6 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6 fc_000000' : 'bg_stake fc_ffffff'">
        <div class="x_panel p0">
          <div class="x_content p0">

              <div class="raf_div_01">
                <div class="row center_flex mb15px">
                  <div class="col-md-10 col-sm-10 col-xs-10 p0">
                    <h4 class="mtb0px fs_18px fw_600 lh_150p  tcenter">
                      Introduce a friend to HappierMe
                    </h4>
                  </div>
                </div>

                <div class="row center_flex">
                  <div class="col-md-10 col-sm-10 col-xs-10 p0">
                    <h4 class="mtb0px fs_12px fw_400 lh_150p  tcenter">
                      We will plant a tree for every friend who subscribes.
                      <a (click)="handleTreeSisterClick()" class="fw_600" [ngClass]="isAdults ? 'fc_D7586B' : 'fc_e58d82'">
                        Click here
                      </a>
                      to read about our Tree Planting Program.
                    </h4>
                  </div>
                </div>

                <div class="mtb30px mregister">
                  <div class="row mb10px">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0 prelative">
                      <input type="text" id="name" (keyup)="keyname($event.target)" class="sp_fc" required [(ngModel)]="name" placeholder="Friend name">
                     <div class="fc_img">
                            <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/svg_user.svg" class="img-responsive" *ngIf="!isAdults">
                            <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/svg_user.svg" class="img-responsive" *ngIf="isAdults">

                          </div>
                    </div>

                    <small class="danger ms-1 mt-1">{{namevalidation()}}</small>

                  </div>

                  <div class="row">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0 prelative">
                      <input type="text" id="email" (keyup)="keyemail($event.target)" required [(ngModel)]="email" class="sp_fc" placeholder="Friend email">
                      <div class="fc_img">
                          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/svg_email.svg" class="img-responsive" *ngIf="!isAdults">
                                                      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/svg_email.svg" class="img-responsive" *ngIf="isAdults">

                        </div>
                    </div>
                    <small class="danger ms-1 mt-1">{{emailvalidation()}}</small>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-12 col-sm-12 col-xs-12 p0">
                    <button type="submit" [disabled]="disabled()"  class="btn btn_raf_submit w100" (click)="submitrefer()">
                      Submit
                    </button>
                  </div>
                </div>
              </div>

              <div class="row mt30px mb15px">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                  <div class="col-md-4 col-sm-4 col-xs-4 p0">
                    <hr class="mtb0px hr_style_v3_05">
                  </div>

                  <div class="col-md-4 col-sm-4 col-xs-4 p0">
                    <h4 class="mtb0px fs_15px fw_400 lh_150p fc_a0a3bd tcenter">
                      Or share via
                    </h4>
                  </div>

                  <div class="col-md-4 col-sm-4 col-xs-4 p0">
                    <hr class="mtb0px hr_style_v3_05">
                  </div>
                </div>
              </div>

              <div class="row center_flex">
                <div class="col-md-12 col-sm-12 col-xs-12 p0 center_flex raf_share_row">
                  <share-buttons  [theme]="'circles-dark'"
                  [include]="['facebook','twitter','linkedin','whatsapp']"
                   [showIcon]="true"
                 [showText]="false"
                  [url]="'https://onelink.to/hsnt8b'"
                  [description]="'Check out the HappierMe Program: The Best Mental Health App for Stress, Anger & Depression Management'"
                  [autoSetMeta]="false"
                 >
                  </share-buttons>

                  <!-- Copy app link button -->
                  <button class="raf_copy_link_btn" (click)="copyAppLink()" [attr.aria-label]="'Copy app link'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span *ngIf="linkCopied" class="raf_copied_text">Copied!</span>
                  </button>
                </div>
              </div>

              <div class="pagebreak"></div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!--/Class -->
</div>
<!-- /page content -->

<!-- footer  -->
<app-bottom-navigation></app-bottom-navigation>
<!-- /footer -->

<app-modal *ngIf="enableAlert" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'" [content]="content"></app-modal>
