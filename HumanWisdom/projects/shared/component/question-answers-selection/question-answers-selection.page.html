<app-course-header [bookmark]="bookmark" [showheaderbar]="false" (sendBookmark)="receiveBookmark($event)" [toc]="toc" [path]="path"
  [bg_tn]="bg_tn"></app-course-header>

<div class="right_col mc_01" (swipeleft)="next('click_Daily_Practice_Next')"
  (swiperight)="back('click_Daily_Practice_Previous')">
  <!-- class -->
  <div class="cw100p">
    <div class="row flex_jc_center slide" id="mdp_sections">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_292d56' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0 tcenter">
            <form>
              <div class="container">
                <div>
                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tcenter center_flex mdp_oli_tray col_cw">
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tleft center_flex">
                          <a class="skip" (click)="back('click_Breathingexercise_Previous')">
                            <button [disabled]="prevBtnDisabled" type="button" class="btn btn_prev_v3 fs_15px fw_400 lh_140p fc_ffffff">
                              <!-- Skip -->
                              Previous
                            </button>
                          </a>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 center_flex">
                          <span class="fc_ffffff">{{ currentSection + 1 }} / 10</span>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tright center_flex">
                          <a data-slide="next" class="next" (click)="this.currentSection === 9 ? this.submitProgress() : next('click_Daily_Practice_Next')">
                            <button type="button" [disabled]="btnDisabled" class="btn btn_prev_v3 fs_15px fw_400 lh_140p fc_ffffff">
                              {{ this.currentSection === 9 ? 'Submit' : 'Next' }}
                            </button>
                          </a>
                        </div>


                      </div>
                    </div>
                  </div>


                  <!-- Sections -->
                  <div class="section-container">
                    <!-- Daily Inspiration -->
                    <ng-container *ngFor="let o of questionAndAns; let ind=index">

                      <div class="box_new_v3_03" [@slideAnimation]="direction" *ngIf="currentSection === ind">
                        <div class="row">
                          <div class="col-md-12 col-sm-12 col-xs-12 p0">
                            <h3 class="txt4">
                              {{o['Que']}}
                            </h3>
                          </div>
                        </div>


                        <div *ngFor="let m of o['OptStr']; let i=index">
                          <div class="row m-b-20 m-t-20" (click)="checkOption(ind, o['OptId'][i], i, o['OptStr'][i])">
                            <div class="col-md-12 col-sm-12 col-xs-12  p0">

                              <div>
                                <a class="sb_anchor" data-toggle="modal" data-target="#lab-slide-bottom-popup">
                                  <div id="{{o['OptStr'][i] + o['Que']}}"
                                    [ngClass]="{'single_select_active': (selectedObj[ind] === o['OptStr'][i]) || false}"
                                    class="box select_box fleft">
                                    <div>
                                      <h3 class="txt9 ctxt9" id="{{o['OptStr'][i] + o['Que'] + 'text'}}">
                                        {{m}}
                                      </h3>
                                    </div>
                                  </div>
                                </a>
                              </div>

                            </div>
                          </div>
                        </div>



                      </div>

                    </ng-container>

                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!--/class -->
</div>
