  <title>Wellness Survey | HumanWisdom</title>

<!-- top navigation -->
<div class="row center_flex tn_module bg_stake col_cw">
  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 tn_title_back col_cw">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a class="" (click)="goBack()">
        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/arrow_left.svg" alt="" class="p0">
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0" >
      <h1 class="fw_600 fs_18px lh_140p  mtb0px tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        Wellness Survey
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 tright">
        <a class="" (click)="goBack()">                  
      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/close.svg" alt="" class="p0">
    </a>
    </div>
  </div>
   <div class="col-md-12 col-sm-12 col-xs-12 p0 hprogressdiv">
      <div class="progress progress-sm hprogress" [ngStyle]="{'visibility': 'visible'}">
        <div class="progress-bar" role="progressbar"
          [ngStyle]="{'visibility': 'visible' ,'min-width': progress + '%', 'max-width': progress + '%', 'width': progress + '%'}"
          aria-valuemax="100"></div>
      </div>
    </div>
</div>

<!-- /top navigation -->

<app-bg-video></app-bg-video>

<div class="right_col mc_01" (swipeleft)="next('click_Daily_Practice_Next')"
  (swiperight)="back('click_Daily_Practice_Previous')">
  <!-- class -->
  <div class="cw100p">
     
    <div class="row flex_jc_center slide" id="mdp_sections">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div class="x_content p0 tcenter">
            <form>
              <div class="container">
                
                <div>
                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12  mdp_oli_traywell col_cw">
                      <!-- <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 " > -->
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tleft">
                          <a class="skip" (click)="back('click_Breathingexercise_Previous')"  *ngIf="prevBtnDisabled" >
                            <button  type="button" class="btn btn_prev_v3 fs_15px fw_400 lh_140p fc_ffffff">
                              <!-- Skip -->
                                <i class="fa fa-angle-left fs_16px fc_ffffff mr10px"></i>

                              Previous
                            </button>
                          </a>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 center_flex">
                          <span class="mtb0px fs_12px fw_400 lh_18px  tcenter cgqtns_sc">{{ currentSection + 1 }} / 10</span>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tright">
                          <!-- <a data-bs-slide="next" [ngClass]="btnDisabled? 'disabled':''" class="next" > -->
                            <button type="button" [disabled]="btnDisabled" class="btn btn_prev_v3 fs_15px fw_400 lh_140p fc_ffffff" (click)="this.currentSection === 9 ? this.submitProgress() : next('click_Daily_Practice_Next')">
                              {{ this.currentSection === 9 ? 'Submit' : 'Next' }}
                              <i class="fa fa-angle-right fs_16px ml10px"></i>

                            </button>
                          <!-- </a> -->
                        </div>


                      <!-- </div> -->
                    </div>
                  </div>


                  <!-- Sections -->
                  <div class="section-container">
                    <!-- Daily Inspiration -->
                    <ng-container *ngFor="let o of questionAndAns; let ind=index">

                      <div class="box_new_v3_03" [@slideAnimation]="direction" *ngIf="currentSection === ind">
                        <div class="row">
                          <div class="col-md-12 col-sm-12 col-xs-12 p0">
                            <h3 class="txt4">
                              {{o['Que']}}
                            </h3>
                          </div>
                        </div>


                        <div *ngFor="let m of o['OptStr']; let i=index">
                          <div class="row m-b-20 m-t-20" (click)="checkOption(ind, o['OptId'][i],  o['Points'][i], o['OptStr'][i])">
                            <div class="col-md-12 col-sm-12 col-xs-12  p0">

                              <div>
                                <a class="sb_anchor" data-bs-toggle="modal" data-bs-target="#lab-slide-bottom-popup">
                                  <div id="{{o['OptStr'][i] + o['Que']}}"
                                    [ngClass]="{'single_select_active': (selectedObj[ind] === o['OptStr'][i]) || false}"
                                    class="box select_box fleft">
                                    <div>
                                      <span class="txt9 ctxt9" id="{{o['OptStr'][i]}}">
                                        {{m.split(".")[0]}}
                                      </span>
                                      <span class="txt12" id="{{o['OptStr'][i]+'text'}}">
                                        {{m.split(".")[1]}}
                                      </span>
                                    </div>
                                  </div>
                                </a>
                              </div>

                            </div>
                          </div>
                        </div>



                      </div>

                    </ng-container>

                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!--/class -->
</div>
