<div class="chat-bot-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-content">
      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/icons/owl-icon.png" alt="Chat Bot Icon" class="bot-icon" />
      <h2 class="bot-title">Olly AI</h2>
    </div>
    <button class="close-button" (click)="onCloseChat()">
      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/images/close.png" alt="Close" class="close-icon" />
    </button>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
   
    <!-- Load History Link - Show when standard welcome plus any prior chat exist -->
    <div *ngIf="hasHistoryAvailable && !isGuestUser()" class="load-history-container">
      <a href="#" class="load-history-link" (click)="onLoadHistory($event)" [class.loading]="isLoadingHistory">
        <span>{{ isLoadingHistory ? 'Loading...' : 'Load Old Conversation' }}</span>
      </a>
    </div>

    <div class="chat-messages" #messageContainer>
      <!-- Dynamic Messages -->
      <div *ngFor="let message of messages; let isFirst = first" class="message" [ngClass]="[message.sender + '-message', message.hideAvatar ? 'bot-followup' : '']">
        <!-- Bot Message -->
        <div *ngIf="message.sender === 'bot' && !message.hideAvatar" class="message-avatar">
          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/icons/owl-transparent.png"  />
        </div>
        
        <div class="message-content-wrapper">
          <div *ngIf="message.sender === 'bot' && !message.hideSender" class="message-sender">Olly</div>
          
          <div class="message-content" [ngClass]="{'typing-indicator': message.isTyping}">
            <!-- Regular message content -->
            <div *ngIf="!message.isTyping" class="bot-message-content" [innerHTML]="sanitizeHtml(message.content)" (click)="onMessageContentClick($event)"></div>
            
            <!-- Suggestions -->
            <div *ngIf="!message.isTyping && message.suggestions && message.suggestions.length > 0" class="suggestions-container">
              <div class="suggestions-instruction">Click on a suggestion or type the number:</div>
              <div class="suggestions-list">
                <button 
                  *ngFor="let suggestion of message.suggestions; let i = index" 
                  class="suggestion-button"
                  (click)="onSuggestionClick(suggestion)">
                  <span class="suggestion-number">{{ i + 1 }}.</span>
                  <span class="suggestion-text">{{ suggestion }}</span>
                </button>
              </div>
            </div>
            
            <!-- Feedback Buttons (Thumbs Up/Down) -->
            <div *ngIf="!message.isTyping && message.allow_feedback && message.sender === 'bot'" class="feedback-container">
              <button 
                class="feedback-button thumbs-up" 
                [class.active]="message.feedback_given === 'positive'"
                [disabled]="message.feedback_given !== null"
                (click)="onThumbsUp(message)"
                title="Helpful">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 22V11M2 13V20C2 21.1046 2.89543 22 4 22H16.4262C17.907 22 19.1662 20.9197 19.3914 19.4562L20.4683 12.4562C20.7479 10.6389 19.3418 9 17.5031 9H14C13.4477 9 13 8.55228 13 8V4.46584C13 3.10399 11.896 2 10.5342 2C10.2093 2 9.91498 2.1913 9.78306 2.48812L7.26394 8.40614C7.10344 8.76727 6.74532 9 6.35013 9H4C2.89543 9 2 9.89543 2 11V13Z" 
                    [attr.stroke]="message.feedback_given === 'positive' ? '#4caf50' : 'currentColor'" 
                    [attr.fill]="message.feedback_given === 'positive' ? '#4caf50' : 'none'"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button 
                class="feedback-button thumbs-down" 
                [class.active]="message.feedback_given === 'negative'"
                [disabled]="message.feedback_given !== null"
                (click)="onThumbsDown(message)"
                title="Not helpful">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17 2V13M22 11V4C22 2.89543 21.1046 2 20 2H7.57377C6.09298 2 4.83383 3.08025 4.60859 4.54377L3.53166 11.5438C3.25213 13.3611 4.65823 15 6.49694 15H10C10.5523 15 11 15.4477 11 16V19.5342C11 20.896 12.104 22 13.4658 22C13.7907 22 14.085 21.8087 14.2169 21.5119L16.7361 15.5939C16.8966 15.2327 17.2547 15 17.6499 15H20C21.1046 15 22 14.1046 22 13V11Z" 
                    [attr.stroke]="message.feedback_given === 'negative' ? '#f44336' : 'currentColor'" 
                    [attr.fill]="message.feedback_given === 'negative' ? '#f44336' : 'none'"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            
            <!-- Typing indicator -->
            <div *ngIf="message.isTyping" class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          
          <span class="timestamp" *ngIf="shouldShowTimestamp(message, isFirst)">{{ formatTimestamp(message.timestamp) }}</span>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        <div class="error-content">
          <p>{{ errorMessage }}</p>
          <div class="error-actions">
            <button class="retry-button" (click)="retryLastMessage()" [disabled]="isLoading">
              Retry
            </button>
            <button class="clear-error-button" (click)="clearError()">
              Dismiss
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Give More Options Button (shown when bot offers related content or has more options) -->
    <div *ngIf="messages.length > 0 && messages[messages.length - 1]?.sender === 'bot' && (messages[messages.length - 1]?.offer_related || messages[messages.length - 1]?.has_more) && !isLoading" class="more-options-container">
      <button class="action-button more-options-button" (click)="onGiveMoreOptions()">
          Give me more options
      </button>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
      <div class="input-container">
        <div class="user-avatar">
          <img [src]="userAvatarUrl" class="avatar-img" alt="User avatar" />
        </div>
        <input 
          type="text" 
          placeholder="Reply ..." 
          class="message-input" 
          [(ngModel)]="currentMessage"
          (keypress)="onKeyPress($event)"
          [disabled]="isLoading"
          #messageInput
        />
        <button 
          class="send-button" 
          (click)="onSendMessage()" 
          [disabled]="!currentMessage.trim() || isLoading"
        >
          <svg *ngIf="!isLoading" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor" />
          </svg>
          <div *ngIf="isLoading" class="loading-spinner"></div>
        </button>
      </div>
    </div>
  </div>
</div>
