<div class="chat-bot-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-content">
      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/icons/owl-icon.png" alt="Chat Bot Icon" class="bot-icon" />
      <h2 class="bot-title">Olly AI</h2>
    </div>
    <button class="close-button" (click)="onCloseChat()">
      <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/images/close.png" alt="Close" class="close-icon" />
    </button>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="chat-messages" #messageContainer>
      <!-- Dynamic Messages -->
      <div *ngFor="let message of messages" class="message" [ngClass]="message.sender + '-message'">
        <!-- Bot Message -->
        <div *ngIf="message.sender === 'bot'" class="message-avatar">
          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/icons/owl-transparent.png"  />
        </div>
        
        <div class="message-content-wrapper">
          <div *ngIf="message.sender === 'bot'" class="message-sender">Olly</div>
          
          <div class="message-content" [ngClass]="{'typing-indicator': message.isTyping}">
            <!-- Regular message content -->
            <div *ngIf="!message.isTyping" class="bot-message-content" [innerHTML]="sanitizeHtml(message.content)"></div>
            
            <!-- Typing indicator -->
            <div *ngIf="message.isTyping" class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          
          <span class="timestamp">{{ formatTimestamp(message.timestamp) }}</span>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        <div class="error-content">
          <p>{{ errorMessage }}</p>
          <div class="error-actions">
            <button class="retry-button" (click)="retryLastMessage()" [disabled]="isLoading">
              Retry
            </button>
            <button class="clear-error-button" (click)="clearError()">
              Dismiss
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
      <div class="input-container">
        <div class="user-avatar">
          <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/images/Ellipse.png" class="avatar-img" />
        </div>
        <input 
          type="text" 
          placeholder="Reply ..." 
          class="message-input" 
          [(ngModel)]="currentMessage"
          (keypress)="onKeyPress($event)"
          [disabled]="isLoading"
          #messageInput
        />
        <button 
          class="send-button" 
          (click)="onSendMessage()" 
          [disabled]="!currentMessage.trim() || isLoading"
        >
          <svg *ngIf="!isLoading" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor" />
          </svg>
          <div *ngIf="isLoading" class="loading-spinner"></div>
        </button>
      </div>
    </div>
  </div>
</div>
