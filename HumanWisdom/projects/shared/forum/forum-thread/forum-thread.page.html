<app-bg-video></app-bg-video>

<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
      <a class="" (click)="routeToLanding()" (keydown.enter)="routeToLanding()" tabindex="0" role="button">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/arrow_left.svg" alt="" class="p0"
          *ngIf="!isAdults">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0" *ngIf="isAdults">

      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1 class="fw_600 fs_18px lh_140p mtb0px tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
        Forum
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright" (click)="share()" (keydown.enter)="share()" tabindex="0"
      role="button">
      <a class="">

        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/share.svg" alt="" class="p0" *ngIf="!isAdults">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/share.svg" alt="" class="p0" *ngIf="isAdults">

      </a>
    </div>
  </div>
</div>
<!-- /top navigation -->

<!-- page content -->
<div class="right_col mc_01">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
        <div class="x_panel p0">
          <div id="toast-container" #toastContainerRef><ng-template toastrContainer></ng-template></div>
          <div class="x_content p0">
            <form>

              <!-- post -->
              <div class="div_forum_post" *ngIf="posttread">
                <a class="bg_FFE8BB">
                  <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
                      <div
                        [ngClass]="(posttread.UserName == UserName) && (posttread.ReplyCount=='0') ? 'col-lg-7 col-md-7 col-sm-7 col-xs-7' : 'col-lg-8 col-md-8 col-sm-8 col-xs-8'"
                        class="p0">
                        <h4 class="mtb0px fs_18px fw_600 lh_24px" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'"
                          *ngIf="posttread.Anonymous=='1'">
                          <!-- Jennifer Hitchner -->
                          Anonymous
                        </h4>

                        <h4 class="mtb0px fs_18px fw_600 lh_24px " [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'"
                          (click)="gotToProfile(posttread.UserId)" (keydown.enter)="gotToProfile(posttread.UserId)"
                          tabindex="0" role="button" *ngIf="posttread.Anonymous=='0'">
                          <!-- Jennifer Hitchner -->
                          {{posttread.UserName}}
                        </h4>
                      </div>

                      <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tright" *ngIf="posttread.UserName != UserName"
                        (click)="follow(posttread)" (keydown.enter)="follow(posttread)" tabindex="0" role="button">
                        <button type="button" class="btn fs_12px fw_600 lh_140p "
                          [ngClass]="isAdults ? 'fc_000000_i' : ''" *ngIf="posttread.Followed=='0'">
                          <i class="fa fa-plus  mr3px"></i>
                          <span class="underline">
                            Follow
                          </span>
                        </button>

                        <button type="button" class="btn fs_12px fw_600 lh_140p"
                          [ngClass]="isAdults ? 'fc_000000_0_5' : 'fc_e8a880'" *ngIf="posttread.Followed=='1'">
                          <i class="fa fa-minus mr3px"></i>
                          <span class="underline">
                            Unfollow
                          </span>
                        </button>
                      </div>

                      <div class="col-lg-4 col-md-4 col-sm-4 col-xs-4 p0 tright" *ngIf="posttread.UserName == UserName"
                        (click)="follow(posttread)" (keydown.enter)="follow(posttread)" tabindex="0" role="button">
                        <button type="button" class="btn fs_12px fw_600 lh_140p fc_000000"
                          *ngIf="posttread.Followed=='0'">
                          <i class="fa fa-plus fa-xs mr3px"></i>
                          <span class="underline">
                            Follow
                          </span>
                        </button>

                        <button type="button" class="btn fs_12px fw_600 lh_140p "
                          [ngClass]="isAdults ? 'fc_000000_0_5' : 'fc_e8a880_0_5'" *ngIf="posttread.Followed=='1'">
                          <i class="fa fa-minus mr3px"></i>
                          <span class="underline">
                            Unfollow
                          </span>
                        </button>
                      </div>

                      <div class="col-lg-1 col-md-1 col-sm-1 col-xs-1 p0 tright"
                        *ngIf="(posttread.UserName == UserName) && (posttread.ReplyCount=='0')">
                        <div class="dropdown position_unseti">
                          <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton0"
                            (click)="toggleDropdown(0, $event)" aria-haspopup="true"
                            [attr.aria-expanded]="openDropdownIndex===0">
                            <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/forum_v3_more.svg"
                              class="img-responsive" *ngIf="!isAdults">
                            <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/forum_v4_more.svg"
                              class="img-responsive" *ngIf="isAdults">
                          </button>
                          <div class="dropdown-menu cfdm" [attr.aria-labelledby]="'dropdownMenuButton0'"
                            [class.show]="openDropdownIndex===0"
                            [style.display]="openDropdownIndex===0 ? 'block' : null">
                            <div class="">
                              <a class="dropdown-item" href="#" (click)="onEditClick($event, posttread, 0)">
                                <div class="row">
                                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                                    <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
                                      <h4 class="mtb0px fs_12px fw_400 lh_140p fc_000000">
                                        Edit
                                      </h4>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
                                      <img
                                        src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/dropdown_edit.svg"
                                        class="img-responsive">
                                    </div>
                                  </div>
                                </div>
                              </a>

                              <div class="row">
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                                  <hr class="m0px">
                                </div>
                              </div>

                              <a class="dropdown-item" href="#" (click)="onDeleteClick($event, posttread)">
                                <div class="row">
                                  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                                    <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
                                      <h4 class="mtb0px fs_12px fw_400 lh_140p fc_000000">
                                        Delete
                                      </h4>
                                    </div>
                                    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
                                      <img
                                        src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/dropdown_trash.svg"
                                        class="img-responsive">
                                    </div>
                                  </div>
                                </div>
                              </a>
                            </div>
                          </div>
                        </div>
                      </div>





                    </div>
                  </div>

                  <div class="row mt5px">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <h4 class="mtb0px fs_12px fw_400 lh_140p"
                        [ngClass]="isAdults ? 'fc_000000_0_5' : 'fc_ffffff_0_5'">
                        <!-- March 26 -->
                        {{getLocalPostDate(posttread?.PostDate)}}
                      </h4>
                    </div>
                  </div>

                  <div class="row" [ngClass]="(posttread.TagName != '' || posttread.ImagePath) ? 'mt10px' : ''">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0" *ngIf="posttread.TagName!=''">
                        <span class="fs_10px fw_600 lh_140p ttuppercase tag-static"
                          [ngClass]="getTagClass(posttread.TagName)">
                          {{posttread.TagName}}
                        </span>
                      </div>

                      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright" *ngIf="posttread.ImagePath">
                        <img alt="" src="https://d1tenzemoxuh75.cloudfront.net{{posttread.ImagePath}}"
                          class="img-responsive w100">
                      </div>
                    </div>
                  </div>

                  <div class="row mt10px">
                    <div class=" col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <h4 class="mtb0px fs_15px fw_400 lh_150p" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'"
                        *ngIf="!posttread.isEditPost">
                        <!-- Freedom from active addiction they say addicts are addicted because we have had childhood trauma... which can be a number of different things that have happened... question is., what's the solution!??? can't find book or video that's helpful! please help -->
                        {{posttread.POST}}
                      </h4>
                      <textarea *ngIf="posttread.isEditPost" (focusout)="editPost()" type="text" name="Post" id="Post"
                        [(ngModel)]="posttread.POST" required="required" class="txtarea_fl_comment"
                        placeholder="Edit Post" rows="5"></textarea>
                    </div>
                  </div>

                  <div class="row mt30px mb20px">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
                        <div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 p0" *ngIf="!isAdults">
                          <button type="button" class="btn fs_12px fw_400 lh_140p " (click)="like(posttread.PostID,0)">
                            <img alt="like" *ngIf="posttread.Liked=='0'"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/like_teen.svg"
                              class="img-responsive mr5px">
                            <img alt="like_filled" *ngIf="posttread.Liked=='1'"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/like_filledteen.svg"
                              class="img-responsive mr5px">
                            {{posttread.PostLikeCount}}
                          </button>
                        </div>
                        <div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 p0" *ngIf="isAdults">
                          <button type="button" class="btn fs_12px fw_400 lh_140p fc_000000_i"
                            (click)="like(posttread.PostID,0)">
                            <img alt="heart" *ngIf="posttread.Liked=='0'"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_heart.svg"
                              class="img-responsive mr5px">
                            <img alt="heart_filled" *ngIf="posttread.Liked=='1'"
                              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/forum_like_filled.svg"
                              class="img-responsive mr5px">
                            {{posttread.PostLikeCount}}
                          </button>
                        </div>

                        <div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 p0">
                          <button type="button" class="btn fs_12px fw_400 lh_140p "
                            [ngClass]="isAdults ? 'fc_000000_i' : ''" [disabled]="DisabledComment(posttread)"
                            (click)="enableCommentTextBox()">
                            <img alt="comment"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/comment_teen.svg"
                              class="img-responsive mr5px" *ngIf="!isAdults">
                            <img alt="comments"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_comment.svg"
                              class="img-responsive mr5px" *ngIf="isAdults">
                            {{posttread.ReplyCount}}
                          </button>
                        </div>

                        <div class="col-lg-3 col-md-3 col-sm-3 col-xs-3 p0">
                          <button type="button" class="btn fs_12px fw_400 lh_140p "
                            [ngClass]="isAdults ? 'fc_000000_i' : ''" (click)="shareOnThread(posttread)">
                            <img alt="shareicon"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/shre_teen.svg"
                              class="img-responsive mr5px" *ngIf="!isAdults">
                            <img alt="shareicon"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_share.svg"
                              class="img-responsive mr5px" *ngIf="isAdults">
                            Share
                          </button>
                        </div>
                      </div>

                      <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
                        <button type="button" class="btn fs_12px fw_400 lh_140p "
                          [ngClass]="isAdults ? 'fc_000000_i' : ''" (click)="reportpost()">
                          <img alt="report"
                            src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/report_teens.svg"
                            class="img-responsive mr5px" *ngIf="!isAdults">
                          <img alt="report"
                            src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_report.svg"
                            class="img-responsive mr5px" *ngIf="isAdults">

                          Report
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="row" *ngIf="isEditComment">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 ">
                      <textarea type="text" rows="5" placeholder="Comment here" class="ta_forum_comment"
                        id="PostComment" name="PostComment" [(ngModel)]="PostComment"></textarea>
                    </div>
                  </div>

                  <div class="row" *ngIf="isReportPost">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <input type="text" name="commenttext" id="commenttext" [(ngModel)]="commenttext"
                        required="required" class="form-control fc_comment" placeholder="Let us know what’s wrong">
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-12 col-sm-12 col-xs-12 mt10px p0" *ngIf="isEditComment">
                      <button type="submit" class="btn btn_post" [disabled]="DisabledComment(posttread)"
                        (click)="commentPost()">
                        Comment
                      </button>
                    </div>
                  </div>
                  <div class="row">

                    <div class="col-md-12 col-sm-12 col-xs-12 mtb10px p0" *ngIf="isLoggedIn && isReportPost">
                      <button type="submit" class="btn btn-warning btn_post" (click)="reportComment(posttread)">
                        Submit
                      </button>
                    </div>
                  </div>
                </a>
              </div>
              <!-- /post -->

              <div class="row mt40px mb15px">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                  <h4 class="mtb0px fs_12px fw_600 lh_140p " [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
                    COMMENTS
                  </h4>
                </div>
              </div>

              <!-- comment -->
              <ng-container *ngIf="list && list.ReplyPost.ReplyPostUserID!=''">
                <div class="div_comment_list div_forum_post mt10px "
                  *ngFor="let item of list.ReplyPost;let index=index">
                  <div class="row mt15px mb5px">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0" (click)="gotToProfile(item.ReplyPostUserID)"
                      (keydown.enter)="gotToProfile(item.ReplyPostUserID)" tabindex="0" role="button">
                      <h4 class="mtb0px fs_12px fw_400 lh_140p "
                        [ngClass]="isAdults ? 'fc_000000_0_5' : 'fc_ffffff_0_5'">
                        {{item.ReplyPostUserName}}
                      </h4>
                    </div>
                  </div>

                  <div class="row mt15px">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
                      <h4 class="mtb0px fs_12px fw_400 lh_140p" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'"
                        *ngIf="(editCommentId != item.ReplyPostID)">
                        <!-- It is possible to move on from our past experiences and heal ourselves - see the modules on stress, conditioning in the app. See the podcast on Overcoming emotional pain in the app. -->
                        {{item.ReplyPost}}
                      </h4>
                    </div>
                  </div>

                  <div class="row  mt40px">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <div class="row">


                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 p0 tleft" *ngIf="!isAdults">
                          <button type="button" (click)="like(item.ReplyPostID,index,posttread.PostID)"
                            class="btn fs_12px fw_400 lh_140p ">

                            <img alt="heart" *ngIf="item.Liked=='0'"
                              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/forum_v3_like.svg"
                              class="img-responsive mr5px">
                            <img alt="heart" *ngIf="item.Liked=='1'"
                              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/forum_v4_like_filled.svg"
                              class="img-responsive mr5px">
                            <span [innerText]="item.ReplyPostLikeCount"></span>
                          </button>
                        </div>

                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 p0 tleft" *ngIf="isAdults">
                          <button type="button" (click)="like(item.ReplyPostID,index,posttread.PostID)"
                            class="btn fs_12px fw_400 lh_140p fc_000000">

                            <img alt="heart" *ngIf="item.Liked=='0'"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_heart.svg"
                              class="img-responsive mr5px">
                            <img alt="filled_heart" *ngIf="item.Liked=='1'"
                              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/forum_like_filled.svg"
                              class="img-responsive mr5px">
                            <span [innerText]="item.ReplyPostLikeCount"></span>
                          </button>
                        </div>


                        <div class="col-lg-6 col-md-6 col-sm-6 col-xs-6 p0 tright">
                          <button type="button" (click)="toggle(item)" class="btn fs_12px fw_400 lh_140p "
                            [ngClass]="isAdults ? 'fc_000000' : ''">
                            <img alt="report"
                              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/forum_v3_report.svg"
                              class="img-responsive mr5px" *ngIf="!isAdults">
                            <img alt="report"
                              src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/forum_report.svg"
                              class="img-responsive mr5px" *ngIf="isAdults">

                            Report
                          </button>
                        </div>

                      </div>
                    </div>
                  </div>
                  <div class="row forum_pt20px" *ngIf="replyflag && activereply.ReplyPostID === item.ReplyPostID">
                    <div class="col-md-12 col-sm-12 col-xs-12">
                      <div class="col-md-12 col-sm-12 col-xs-12 p0">
                        <input type="text" name="posttext" id="comment" [(ngModel)]="reportText" required="required"
                          class="form-control fc_comment" placeholder="Let us know what’s wrong">
                      </div>

                      <div class="col-md-12 col-sm-12 col-xs-12 forum_pt10px p0 tright mt10px">
                        <button type="submit" class="btn btn-warning btn_post" (click)="reportComment(item)">
                          Submit
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- <div class="row">
                    <div class="col-md-12 col-sm-12 col-xs-12 p0">
                      <hr class="hr_style_v3_05 mtb20px">
                    </div>
                  </div> -->
                </div>
              </ng-container>
              <!-- /comment -->
              <div class="row" style="display: none;">
                <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 p0">
                  <button type="button" class="btn btn_v3_nt_post" #postModal data-toggle="modal"
                    data-target="#posted_successfully">
                    Posted modal
                  </button>
                </div>
              </div>
              <div class="pagebreak"></div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="posted_successfully" data-keyboard="false" data-backdrop="false">
    <div class="row center_flex h100p">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 v3_modal_posted_successfully"
        [ngClass]="isAdults ? 'bg_ffffff' : 'bg_stake'">

        <div class="row">
          <div class="col-md-12 col-sm-12 col-xs-12 p0">
            <button type="button" class="btn_popup_close m0px" (click)="closePost()" data-bs-dismiss="modal"
              aria-label="close">
              <img alt="close popup button"
                src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/v3_close_modal.svg"
                class="img-responsive fright" *ngIf="!isAdults">

              <img alt="close popup button" src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/close.svg"
                class="img-responsive fright" *ngIf="isAdults">

            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tcenter">
            <img alt="tick to show posted successfully" *ngIf="submissionState==='success'"
              src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/v3_tick_successfull.svg"
              class="img-responsive">
            <div *ngIf="submissionState!=='success'" class="modal-spinner"></div>
          </div>
        </div>

        <div class="row mt30px">
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
            <h3 class="mtb0px fs_18px fw_600 lh_145p tcenter" [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">
              {{ modalText }}
            </h3>
          </div>
        </div>

      </div>
    </div>
  </div>
  <app-modal *ngIf="enableAlert" [modalid]="'logout'" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'"
    [enableCancel]="true" [content]="'Please register to use this feature'"></app-modal>
</div>

<div class="modal fade slide-up" id="edit_post" data-bs-keyboard="false" data-bs-backdrop="false">
  <div class="row center_flex">
    <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 lab-modal-bodyfourm modal_cc col_cw">
      <div class="row mb10px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 center_flex">
          <div class="col-lg-10 col-md-10 col-sm-10 col-xs-10 p0">
            <h4 class="mtb0px fs_18px fw_500 lh_140p " [ngClass]="isAdults ? 'fc_000000' : 'fc_ffffff'">Edit post</h4>
          </div>
          <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0 tright">
            <button type="button" class="btn_popup_close m0px" (click)="closePost()" aria-label="close"
              data-bs-dismiss="modal">
              <img
                src="{{ isAdults ? 'https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v_1_4/close.svg' : 'https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v1_3/v3_close_modal.svg' }}"
                class="img-responsive fright">
            </button>
          </div>
        </div>
      </div>

      <div class="row mb10px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
          <textarea [(ngModel)]="editingPostText" class="mtb0px ta_new_thread" maxlength="256" rows="5"
            placeholder="Edit Post"></textarea>
        </div>
      </div>

      <div class="row mb10px">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0 tright">
          <button type="button" class="btn btn-default btn_fpfy_mh mr10px"
            (click)="closeEditPostModal()">Cancel</button>
          <button type="button" class="btn btn-default btn_fpfy_mh" (click)="saveEditedPost()">Save</button>
        </div>
      </div>
    </div>
  </div>

</div>
