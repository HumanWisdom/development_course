<title>Guided Journey Days | HumanWisdom</title>

<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_we col_cw">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2">
      <a class="" (click)="goBack()">
        <img src="https://d1tenzemoxuh75.cloudfront.net/assets/svgs/v_1_4/back.svg" alt="" class="p0" />
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1 class="mtb0px fs_18px fw_600 lh_150p fc_000000 tcenter">
        Stress reduction
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 tright">
      <!-- Add extra icons if needed -->
    </div>
  </div>
</div>

<app-bg-video></app-bg-video>

<!-- page content -->
<div class="right_col mc_01_v3 mc_01_v3_ext" (touchstart)="handleTouchStart($event)" (touchend)="handleTouchEnd($event)"
     (mousedown)="handleTouchStart($event)" (mouseup)="handleTouchEnd($event)" (mouseleave)="handleTouchEnd($event)">
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 col_cw" [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">

        <div *ngIf="isLoading" class="row center_flex mt40px">
          <div class="col-md-12 tcenter">
            <h4 [ngClass]="isAdults? 'fc_000000': 'fc_ffffff'">Loading day content...</h4>
          </div>
        </div>

        <div *ngIf="!isLoading" class="x_panel p0 nobg">
          <div class="x_content p0">

            <!-- Day Header -->
            <div class="row mb20px">
              <div class="col-md-12 p0">
                <h4 class="mt0px fs_14px fw_600 fc_000000">
                  Day {{currentDay}} of {{totalDays}}
                </h4>
              </div>
            </div>

            <!-- Exercises List -->
            <div *ngFor="let exercise of displayExercises; let i = index">

              <!-- Large Card Style (e.g., first one or based on some property) -->
              <div *ngIf="i === 0 || exercise.imgPath.includes(',')" class="exercise_card"
                (click)="onExerciseClick(exercise)">
                <img [src]="exercise.imgPath.split(',')[0]" class="card_img" alt="">
                <div class="card_content">
                  <h3 class="exercise_title">{{exercise.Title}}</h3>
                  <p class="exercise_meta">{{exercise.Section}}</p>
                  <div class="read_status" *ngIf="exercise.isRead === '1'">
                    <i class="fa fa-check-circle"></i>
                  </div>
                </div>
              </div>

              <!-- Small Card Style -->
              <div *ngIf="i > 0 && !exercise.imgPath.includes(',')" class="exercise_card_small"
                (click)="onExerciseClick(exercise)">
                <img [src]="exercise.imgPath" class="card_img_small" alt="">
                <div class="small_content">
                  <h3 class="exercise_title mb0">{{exercise.Title}}</h3>
                  <p class="exercise_meta mb0">{{exercise.Section}}</p>
                </div>
                <div class="read_status" *ngIf="exercise.isRead === '1'">
                  <i class="fa fa-check-circle"></i>
                </div>
              </div>

            </div>

            <!-- Journal / Question Section (Example based on Figma) -->
            <div class="journal_box">
              <h4 class="journal_title">What do you think are your common stress triggers?</h4>
              <textarea placeholder="Tap to answer"></textarea>
              <div class="journal_footer">
                Your online journal is secure and private to you.
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Fixed Footer Days Navigation -->
    <div class="footer_fixed_wrapper">
      <!-- Dots Row (Intro + Days) -->
      <div class="row center_flex">
        <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 footer_dots col_cw"
             [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
          <div class="dots_container">
            <span class="dot" [ngClass]="{'active': currentDay === 0}"></span>
            <span *ngFor="let dayNum of getDaysArray()" class="dot" [ngClass]="{'active': currentDay === dayNum}">
            </span>
          </div>
        </div>
      </div>

      <div class="row center_flex">
        <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 footer_days col_cw"
          [ngClass]="isAdults ? 'bg_FFF7E6' : 'bg_stake'">
          <div class="odiv">
            <div class="day_circle intro_circle" [ngClass]="{'active': currentDay === 0, 'visited': isVisited(0)}"
              (click)="navigateToDay(0)">
              <span>Intro</span>
            </div>
            <div *ngFor="let dayNum of getDaysArray()" class="day_circle"
              [ngClass]="{'active': currentDay === dayNum, 'visited': isVisited(dayNum) && currentDay !== dayNum}"
              (click)="navigateToDay(dayNum)">
              <span>Day {{dayNum}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
