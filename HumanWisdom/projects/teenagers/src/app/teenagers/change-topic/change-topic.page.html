<!-- page content -->
<div class="right_col mc_02">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 bg_183c79 col_cw">
        <div class="x_panel p0">
          <div class="x_content p0">

            <div class="header-section">
              <h1 class="heading-title fw_500 fs_21px lh_160p fc_ffffff mt40px mb0 tcenter">
                What are you looking for?
              </h1>
              <p class="fs_15px fw_400 lh_150p mt10px tcenter mb40px" [ngClass]="'fc_ffffff_0_5'">
                Choose what matters most to you right now
              </p>
            </div>

            <div class="div_ct">
              <div class="row">
                <div class="col-xs-12 card-container">
                  <div (click)="updateList(item.id, item.name)" class="topic-card-wrapper"
                    *ngFor="let item of changeTopicList">
                    <button class="topic-card" [class.selected]="item.id == selectedId">
                      <span class="fw_500 fs_15px lh_140p fc_ffffff">
                        {{getTopicDisplayName(item.name)}}
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="sticky-footer col-lg-4 col-md-6 col-sm-6 col-xs-12 col_cw">
              <a (click)="skip()" class="skip-btn fs_15px fw_500 td_underline">Skip</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->
