<!-- top navigation -->
<div class="row center_flex">
  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back col_cw" *ngIf="!isRoutedFromLogin">
    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0" (click)="goBack()">
      <a class="">
        <img src="https://humanwisdoms3.s3.eu-west-2.amazonaws.com/assets/svgs/v1_3/arrow_left.svg" alt="" class="p0">
      </a>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-8 col-xs-8 p0">
      <h1 class="fw_600 fs_18px lh_140p fc_ffffff mtb0px tcenter">
        Change topic
      </h1>
    </div>

    <div class="col-lg-2 col-md-2 col-sm-2 col-xs-2 p0">
    </div>
  </div>

  <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 tn_title_back_change_topic col_cw" *ngIf="isRoutedFromLogin">
    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 p0">
      <h1 class="heading-title fw_500 fs_21px lh_160p fc_ffffff mt30px mb10px tcenter">
        What are you looking for?
      </h1>
    </div>
  </div>
</div>
<!-- /top navigation -->

<!-- page content -->
<div class="right_col mc_01">
  <!-- class -->
  <div class="cw100p">
    <div class="row center_flex">
      <div class="col-lg-4 col-md-6 col-sm-6 col-xs-12 sc_01 bg_183c79 col_cw">
        <div class="x_panel p0">
          <div class="x_content p0">

            <div class="div_ct">
              <div class="row">
                <div class="col-xs-12 card-container">
                  <div (click)="updateList(item.id,item.name)" class="topic-card-wrapper"
                    *ngFor="let item of changeTopicList">
                    <button class="topic-card" [class.selected]="item.id == selectedId">
                      <span class="fw_500 fs_15px lh_140p fc_ffffff">
                        {{getTopicDisplayName(item.name)}}
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row mt20px mb20px tcenter">
              <div class="col-xs-12">
                <a (click)="skip()" class="skip-btn fs_15px fw_500 td_underline">I'm not sure</a>
              </div>
            </div>


            <div style="padding-bottom: 80px;"></div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /page content -->

<!-- footer  -->
<ng-container *ngIf="!isRoutedFromLogin">
  <app-bottom-navigation [dash]="true" (journalclick)="getclcickevent($event)"></app-bottom-navigation>
</ng-container>
<!-- /footer -->
