<app-splash *ngIf="!pageLoaded"></app-splash>
<app-tn-dashboard-v03 [isShowHeader]="isShowHeader" [isLoginPage]="isLoginPage" [enableplaystore]="enableplaystore"
  [routeid]="routeid" [enableHamburger]="isEnableHam" (playstoreenable)="getplaystore($event)"></app-tn-dashboard-v03>


<router-outlet></router-outlet>

<ng-container *ngIf="enableFooter()">
  <app-bottom-navigation [dash]="dash" [journal]="journal" [fourm]="fourm" [search]="search"
    [enableprofile]="enableprofile" (journalclick)="getclcickevent($event)"></app-bottom-navigation>
</ng-container>

<app-survey>
</app-survey>

<!-- Session Expired Modal -->
<div class="modal fade" id="sessionExpiredModal" tabindex="-1" aria-labelledby="sessionExpiredModalLabel"
  aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 380px; margin: auto;">
    <div class="modal-content" style="border-radius: 20px; border: none; background: transparent;">
      <div class="modal-body v1_3_bg_splash_teens text-center" style="border-radius: 20px; padding: 30px 25px;">
        <h4 style="font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 15px;">Session Expired</h4>
        <p
          style="font-size: 15px; font-weight: 400; color: #ffffff; opacity: 0.85; line-height: 1.5; margin-bottom: 25px;">
          Your session has expired. Please log in again to continue.
        </p>
        <div class="d-grid shadow-sm">
          <button type="button" class="btn btn_ctd" (click)="logoutFromSession()"
            style="border-radius: 100px; height: 50px; font-weight: 700; font-size: 16px;">Logout</button>
        </div>
      </div>
    </div>
  </div>
</div>
