<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Accept a card payment</title>
    <meta name="description" content="A demo of a card payment on Stripe" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- <link rel="stylesheet" href="global.css" /> -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?version=3.52.1&features=fetch"></script>
    <script src="client.js" defer></script>
  </head>

  <body>
    <!-- Display a payment form -->
    <div class="row center_flex h100vh">
      <div class="col-md-6 col-sm-8 col-xs-12">
        <!-- Back button -->
        <div class="row mb-3">
          <div class="col-12">
            <a (click)="back()" style="cursor: pointer; display: inline-flex; align-items: center; color: #007bff; text-decoration: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              <span class="ml-2">Back</span>
            </a>
          </div>
        </div>
        
        <form id="payment-form">
          <div id="card-element"><!--Stripe.js injects the Card Element--></div>
          <div id="card-element-errors" role="alert"></div>
          <input id="name" type="text" />
              <button id="btnsubmit" type="submit" >Pay now</button>
        </form>
      </div>
    </div>

    <button id="hiddenSubmit" #payementSubmitBtnClick style="visibility: hidden" type="button">
      hidden Submit
    </button>
    
  </body>
</html>

<app-modal *ngIf="enableAlert" (closeEvent)="getAlertcloseEvent($event)" [okText]="'Ok'" [content]="content">
</app-modal>
