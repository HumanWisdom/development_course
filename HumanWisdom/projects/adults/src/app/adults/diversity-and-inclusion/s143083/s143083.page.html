<app-course-header [bookmark]="bookmark" (sendBookmark)="receiveBookmark($event)" [toc]="toc" [path]="path" [bg_tn]="bg_tn"></app-course-header>

<app-lengthy-text [bg]="bg">

  <form>

    <h1 class="txt2 fw_500 lengthy_txt_title">
      Why is it so difficult to let go of our prejudices?
    </h1>

    <div class="clearfix"></div>

    <h3 class="txt2 lengthy_txt_pointer">
      1. They have become a part of our identity, of who we are
    </h3>

    <h3 class="txt2 lengthy_txt_pointer">
      2. We are not aware of them
    </h3>

    <h3 class="txt2 lengthy_txt_pointer">
      3. We feel threatened when anyone suggests we may prejudiced
    </h3>

    <h3 class="txt2 lengthy_txt_pointer">
      4. The hidden drivers that created them are not understood
    </h3>

  </form>

</app-lengthy-text>
