sonar.projectKey=HumanWisdom_development_course	
sonar.organization=humanwisdom	
sonar.exclusions=HumanWisdom/projects/assets/**/*,HumanWisdom/projects/teenagers/**/*,HumanWisdom/projects/adults/**/*,api/**/*,program/**/*,**/*.spec.ts,**/test.ts,**/polyfills.ts,**/*.mock.ts,**/karma.conf.js,**/karma-*.conf.js,**/testing/**,**/node_modules/**,**/coverage/**,**/dist/**,**/*.e2e.ts
sonar.javascript.node.maxspace=16384

# Coverage report paths
sonar.typescript.lcov.reportPaths=HumanWisdom/coverage/adults/lcov.info,HumanWisdom/coverage/shared/lcov.info
sonar.javascript.lcov.reportPaths=HumanWisdom/coverage/adults/lcov.info,HumanWisdom/coverage/shared/lcov.info

# Additional coverage exclusions (files that should not be counted in coverage metrics)
sonar.coverage.exclusions=HumanWisdom/projects/shared/**/*.spec.ts

# Test file patterns (tells Sonar these are test files, not production code)
sonar.tests=HumanWisdom/projects/shared
sonar.test.inclusions=HumanWisdom/projects/shared/**/*.spec.ts

# Exclude test files from duplication detection
sonar.cpd.exclusions=HumanWisdom/projects/shared/**/*.spec.ts